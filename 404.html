<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://mr-abdala.vercel.app/logo.png" type="image/png">
    <title>404 - الصفحة غير موجودة</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&family=Zain:wght@200;300;400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #FF7A00;
            --primary-light: #FF9A3D;
            --primary-dark: #E56A00;
            --secondary-color: #333333;
            --text-color: #444444;
            --light-gray: #F8F9FA;
            --gradient: linear-gradient(135deg, #FF7A00 0%, #FF9A3D 100%);
            --shadow: 0 10px 30px rgba(255, 122, 0, 0.15);
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            color: #333;
        }

        /* خلفية متحركة */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .animated-bg span {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: move 25s linear infinite;
            bottom: -150px;
        }

        .animated-bg span:nth-child(1) {
            left: 25%;
            width: 80px;
            height: 80px;
            animation-delay: 0s;
            background: rgba(255, 122, 0, 0.1);
        }

        .animated-bg span:nth-child(2) {
            left: 10%;
            width: 50px;
            height: 50px;
            animation-delay: 2s;
            animation-duration: 17s;
            background: rgba(255, 255, 255, 0.15);
        }

        .animated-bg span:nth-child(3) {
            left: 70%;
            width: 100px;
            height: 100px;
            animation-delay: 4s;
            background: rgba(255, 122, 0, 0.1);
        }

        .animated-bg span:nth-child(4) {
            left: 40%;
            width: 150px;
            height: 150px;
            animation-delay: 0s;
            animation-duration: 30s;
            background: rgba(255, 255, 255, 0.1);
        }

        .animated-bg span:nth-child(5) {
            left: 65%;
            width: 60px;
            height: 60px;
            animation-delay: 0s;
            background: rgba(255, 122, 0, 0.1);
        }

        .animated-bg span:nth-child(6) {
            left: 85%;
            width: 40px;
            height: 40px;
            animation-delay: 3s;
            background: rgba(255, 255, 255, 0.15);
        }

        @keyframes move {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 0;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        /* الحاوية الرئيسية */
        .container {
            width: 90%;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* بطاقة 404 */
        .error-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 60px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* الرقم 404 المتحرك */
        .error-number {
            font-size: 180px;
            font-weight: 900;
            font-family: 'Rubik', sans-serif;
            line-height: 1;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
            color: var(--primary-color);
            text-shadow: 5px 5px 0 rgba(255, 122, 0, 0.2);
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 100% {
                transform: skew(0deg);
                text-shadow: 5px 5px 0 rgba(255, 122, 0, 0.2);
            }
            95% {
                transform: skew(0deg);
                text-shadow: 5px 5px 0 rgba(255, 122, 0, 0.2);
            }
            96% {
                transform: skew(10deg);
                text-shadow: -5px 0 0 rgba(255, 0, 0, 0.5), 5px 0 0 rgba(0, 0, 255, 0.5);
            }
            97% {
                transform: skew(-10deg);
                text-shadow: 5px 0 0 rgba(255, 0, 0, 0.5), -5px 0 0 rgba(0, 0, 255, 0.5);
            }
            98% {
                transform: skew(5deg);
                text-shadow: -3px 0 0 rgba(255, 0, 0, 0.5), 3px 0 0 rgba(0, 0, 255, 0.5);
            }
            99% {
                transform: skew(0deg);
                text-shadow: 2px 2px 0 rgba(255, 122, 0, 0.2);
            }
        }

        /* الأصفار المتحركة */
        .zero {
            display: inline-block;
            animation: bounce 2s infinite;
        }

        .zero:nth-child(2) {
            animation-delay: 0.2s;
        }

        .zero:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        /* عنوان الصفحة */
        .error-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--secondary-color);
            font-family: 'Rubik', sans-serif;
            animation: fadeIn 1s ease 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* وصف الخطأ */
        .error-description {
            font-size: 20px;
            color: #666;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            animation: fadeIn 1s ease 0.6s both;
            line-height: 1.8;
        }

        /* أيقونة البحث */
        .search-icon {
            font-size: 60px;
            color: var(--primary-color);
            margin-bottom: 30px;
            animation: pulse 2s infinite, rotate 10s linear infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* مجموعة الأزرار */
        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            animation: fadeIn 1s ease 0.9s both;
        }

        .btn {
            padding: 16px 35px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
            font-family: 'Rubik', sans-serif;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 122, 0, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 122, 0, 0.5);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-outline:hover {
            background: var(--gradient);
            color: white;
            transform: translateY(-3px) scale(1.05);
            border-color: transparent;
        }

        /* روابط سريعة */
        .quick-links {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px dashed rgba(255, 122, 0, 0.3);
            animation: fadeIn 1s ease 1.2s both;
        }

        .quick-links h3 {
            font-size: 24px;
            color: var(--secondary-color);
            margin-bottom: 20px;
            font-family: 'Rubik', sans-serif;
        }

        .links-grid {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .quick-link {
            text-decoration: none;
            color: #666;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            padding: 10px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.5);
        }

        .quick-link:hover {
            color: var(--primary-color);
            transform: translateY(-3px);
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .quick-link i {
            font-size: 20px;
        }

        /* شخصية 404 */
        .character {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .character-face {
            width: 100px;
            height: 100px;
            background: var(--gradient);
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 10px 20px rgba(255, 122, 0, 0.3);
        }

        .character-eye {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 35px;
            animation: blink 3s infinite;
        }

        @keyframes blink {
            0%, 45%, 55%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }

        .character-eye.left {
            left: 20px;
        }

        .character-eye.right {
            right: 20px;
        }

        .character-mouth {
            width: 40px;
            height: 20px;
            border-bottom: 5px solid white;
            border-radius: 0 0 20px 20px;
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
        }

        .character-tear {
            position: absolute;
            width: 5px;
            height: 15px;
            background: rgba(0, 0, 255, 0.3);
            border-radius: 50%;
            animation: drop 2s infinite;
        }

        @keyframes drop {
            0% { transform: translateY(0); opacity: 1; }
            80% { transform: translateY(30px); opacity: 0.5; }
            100% { transform: translateY(40px); opacity: 0; }
        }

        .character-tear.left {
            left: 35px;
            top: 45px;
        }

        .character-tear.right {
            right: 35px;
            top: 45px;
            animation-delay: 0.5s;
        }

        

        /* تنسيق للشاشات الصغيرة */
        @media (max-width: 768px) {
            .error-number {
                font-size: 120px;
            }

            .error-title {
                font-size: 32px;
            }

            .error-description {
                font-size: 18px;
                padding: 0 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .links-grid {
                flex-direction: column;
                align-items: center;
            }

            .quick-link {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 40px 20px;
            }

            .error-number {
                font-size: 80px;
            }

            .character {
                width: 150px;
                height: 150px;
            }
        }

        /* تأثير الكتابة */
        .typing-effect {
            direction: ltr;
            display: inline-block;
            font-family: monospace;
            border-left: 3px solid var(--primary-color);
            padding-left: 5px;
            animation: blinkCursor 1s infinite;
        }

        @keyframes blinkCursor {
            0%, 100% { border-color: var(--primary-color); }
            50% { border-color: transparent; }
        }

        /* شعار الموقع */
        .logo {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 10;
            animation: slideIn 1s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .logo img {
            width: 60px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .logo img:hover {
            transform: scale(1.1) rotate(5deg);
        }
    </style>
</head>
<body>
    <!-- خلفية متحركة -->
    <div class="animated-bg">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- شعار الموقع -->
    <a href="/" class="logo">
        <img src="https://mr-abdala.vercel.app/logo.png" alt="شعار" onerror="this.src='https://via.placeholder.com/60x60/FF7A00/ffffff?text=MR'">
    </a>

    <div class="container">
        <div class="error-card">
            <!-- شخصية 404 -->
            <div class="character">
                <div class="character-face">
                    <div class="character-eye left"></div>
                    <div class="character-eye right"></div>
                    <div class="character-mouth"></div>
                    <div class="character-tear left"></div>
                    <div class="character-tear right"></div>
                </div>
            </div>

            <!-- الرقم 404 المتحرك -->
            <div class="error-number">
                <span class="zero">4</span>
                <span class="zero">0</span>
                <span class="zero">4</span>
            </div>

            <!-- العنوان -->
            <h1 class="error-title">عفواً! الصفحة غير موجودة</h1>

            <!-- الوصف -->
            <p class="error-description">
                <i class="fas fa-map-signs" style="color: var(--primary-color); margin-left: 10px;"></i>
                يبدو أنك قد ضللت الطريق! الصفحة التي تبحث عنها غير موجودة أو تم نقلها.
            </p>

            <!-- أيقونة البحث -->
            <div class="search-icon">
                <i class="fas fa-search"></i>
            </div>

            <!-- تأثير الكتابة -->
            <div style="margin-bottom: 30px; font-size: 18px; color: #666;">
                <span class="typing-effect" id="typing-text"></span>
            </div>

            <!-- الأزرار -->
            <div class="button-group">
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-home"></i>
                    الصفحة الرئيسية
                </a>
               
            </div>
        </div>
    </div>

    <script>
        // تأثير الكتابة
        const text = "انتا بتبحث عن صفحه غلط";
        let index = 0;
        const typingElement = document.getElementById('typing-text');

        function typeWriter() {
            if (index < text.length) {
                typingElement.innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, 100);
            } else {
                setTimeout(() => {
                    typingElement.innerHTML = '';
                    index = 0;
                    typeWriter();
                }, 3000);
            }
        }

        // بدء تأثير الكتابة بعد تحميل الصفحة
        window.onload = function() {
            typeWriter();
        };

        
         // منع النسخ وحماية الصفحة
        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("keydown", function(e) {
            if (e.key === "F12" || 
                (e.ctrlKey && e.shiftKey && e.key === "I") || 
                (e.ctrlKey && e.key === "U")) {
                e.preventDefault();
            }
        });
        

        // حركة العيون تتبع المؤشر (تأثير إضافي)
        document.addEventListener('mousemove', function(e) {
            const eyes = document.querySelectorAll('.character-eye');
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            eyes.forEach(eye => {
                const eyeRect = eye.getBoundingClientRect();
                const eyeCenterX = eyeRect.left + eyeRect.width / 2;
                const eyeCenterY = eyeRect.top + eyeRect.height / 2;
                
                const angle = Math.atan2(mouseY - eyeCenterY, mouseX - eyeCenterX);
                const distance = Math.min(10, Math.hypot(mouseX - eyeCenterX, mouseY - eyeCenterY) / 20);
                
                const moveX = Math.cos(angle) * distance;
                const moveY = Math.sin(angle) * distance;
                
                eye.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });
    </script>
</body>
</html>
