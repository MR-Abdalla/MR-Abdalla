<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<style>

</head>
<body>

<header>
  <img id="logo" src="logo.png" class="profile-avatar">
  <h1 class="app-title">ملفي الشخصي</h1>
</header>

<div class="main-container">
  <div class="profile-hero">
    <div class="avatar-container">
      <img src="profile.png" alt="صورة البروفايل" >
    </div>
    
    <div class="profile-info">
      <h1>معلومات الشخصيه</h1>
      <P>عدل بيناتك بس مش هتقدر تعدل الصف او ولا رقم الهاتف</P>
      <p>ضيف تاريخ ملادك و البريد الالكتروني </p>
    </div>

  </div>

</div>

<div class="menu-slider">
  <a href="https://mr-abdala.vercel.app/profile/" >الرئيسية</a>

<!-- ✅ بيانات الطالب -->
<div class="info-box">
  <label>الاسم</label>
  <input type="text" id="nameInput">

  
</div>


<div class="info-box">
<label>المدرسة</label>
  <input type="text" id="schoolInput">

<label>الصف الدراسي</label>
  <input type="text" id="gradeInput" disabled >
</div>


<div class="info-box">

  <label>المحافظة</label>
  <input type="text" id="govInput" disabled>

</div>


  <div class="info-box">

   <label>رقم الطالب</label>
  <input type="text" id="studentPhoneInput">

  <label>رقم ولي الأمر</label>
  <input type="text" id="parentPhoneInput" disabled>

  </div>

<div class="info-box">  
    <label>تاريخ الميلاد</label>
  <div class="birthdate-selects">
    <select id="birthDay"><option value="">اليوم</option></select>
    <select id="birthMonth"><option value="">الشهر</option></select>
    <select id="birthYear"><option value="">السنة</option></select>
  </div> 
</div>
 

<div class="info-box"> 
  <label>البريد الإلكتروني (اختياري)</label>
  <input type="email" id="emailInput" placeholder="اكتب بريدك الإلكتروني هنا">
</div>


    <button class="save-btn" id="saveChanges">💾 حفظ البيانات</button>






<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCPrQEr2OXfcjPyCRb5uT9KQKZjf5aBDg8",
  authDomain: "studint-code.firebaseapp.com",
  projectId: "studint-code",
  storageBucket: "studint-code.firebasestorage.app",
  messagingSenderId: "736980801683",
  appId: "1:736980801683:web:9e7b1f7caf90b39ded5566",
  measurementId: "G-JV9BQ5KTS9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const daySelect = document.getElementById('birthDay');
const monthSelect = document.getElementById('birthMonth');
const yearSelect = document.getElementById('birthYear');

// تعبئة القوائم
for (let d=1; d<=31; d++){
  let opt = document.createElement('option');
  opt.value = d.toString().padStart(2,'0');
  opt.textContent = d;
  daySelect.appendChild(opt);
}

const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
for (let m=1; m<=12; m++){
  let opt = document.createElement('option');
  opt.value = m.toString().padStart(2,'0');
  opt.textContent = monthNames[m-1];
  monthSelect.appendChild(opt);
}

const currentYear = new Date().getFullYear();
for (let y=currentYear; y>=1980; y--){
  let opt = document.createElement('option');
  opt.value = y;
  opt.textContent = y;
  yearSelect.appendChild(opt);
}

document.addEventListener('DOMContentLoaded', async () => {
  const localData = JSON.parse(localStorage.getItem('studentData')) || {};
  const studentId = localData.studentId;
  if (!studentId) return;

  const studentRef = doc(db, 'students', studentId);
  const studentSnap = await getDoc(studentRef);

  if (studentSnap.exists()) {
    const data = studentSnap.data();

    document.getElementById('nameInput').value = data.name || '';
    document.getElementById('schoolInput').value = data.school || '';
    document.getElementById('gradeInput').value = data.grade || '';
    document.getElementById('govInput').value = data.governorate || '';
    document.getElementById('studentPhoneInput').value = data.studentPhone || '';
    document.getElementById('parentPhoneInput').value = data.parentPhone || '';

    // تعبئة التاريخ لو موجود
    if (data.birthDate) {
      const birth = new Date(data.birthDate);
      daySelect.value = birth.getDate().toString().padStart(2,'0');
      monthSelect.value = (birth.getMonth()+1).toString().padStart(2,'0');
      yearSelect.value = birth.getFullYear();
    }

    const emailInput = document.getElementById('emailInput');
    if (data.email && data.email.trim() !== '') {
      emailInput.value = data.email;
      emailInput.disabled = false;
    } else {
      emailInput.value = '';
      emailInput.disabled = false;
      emailInput.placeholder = "البريد الإلكتروني غير موجود، يمكنك إدخاله";
    }

    if (data.avatar) {
      document.querySelectorAll('.profile-avatar').forEach(img => img.src = data.avatar);
    }

  }
});

// ✅ حفظ بيانات الطالب
  document.getElementById('saveChanges').addEventListener('click', async () => {
    const name = document.getElementById('nameInput').value.trim();
    const school = document.getElementById('schoolInput').value.trim();
    const grade = document.getElementById('gradeInput').value.trim();
    const gov = document.getElementById('govInput').value.trim();
    const studentPhone = document.getElementById('studentPhoneInput').value.trim();
    const parentPhone = document.getElementById('parentPhoneInput').value.trim();
    const email = document.getElementById('emailInput').value.trim();
    const day = document.getElementById('birthDay').value;
    const month = document.getElementById('birthMonth').value;
    const year = document.getElementById('birthYear').value;

    if (!name && !school && !email && (!day || !month || !year)) {
      alert('⚠️ من فضلك أدخل البيانات المطلوبة');
      return;
    }

    const localData = JSON.parse(localStorage.getItem('studentData')) || {};
    const studentId = localData.studentId;
    if (!studentId) {
      alert('⚠️ لم يتم العثور على رقم الطالب في البيانات المحلية');
      return;
    }

    const updated = {};
    if (name) updated.name = name;
    if (school) updated.school = school;
    if (grade) updated.grade = grade;
    if (gov) updated.governorate = gov;
    if (studentPhone) updated.studentPhone = studentPhone;
    if (parentPhone) updated.parentPhone = parentPhone;
    if (email) updated.email = email;
    if (day && month && year) updated.birthDate = `${year}-${month}-${day}`;

    try {
      const studentRef = doc(db, 'students', studentId);
      await updateDoc(studentRef, updated);
      alert('✅ تم حفظ البيانات ويمكنك تعديلها في أي وقت');
    } catch (error) {
      console.error(error);
      alert('⚠️ حدث خطأ أثناء حفظ البيانات');
    }
  });


</script>


 
</body>
</html>
