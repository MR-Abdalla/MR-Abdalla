<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <title>إدارة الفيديوهات المتطورة - مستر عبدالله السيد</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Tajawal', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }
    
    body {
      direction: rtl;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    
    ::selection {
      background: #FF6B35;
      color: white;
    }
    
    .app {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    /* ===== الهيدر ===== */
    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-radius: 24px;
      padding: 30px 40px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
    }
    
    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 80%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,107,53,0.08) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulseGlow 8s ease-in-out infinite;
    }
    
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
    }
    
    .header h1 {
      color: white;
      font-size: clamp(24px, 3vw, 36px);
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 1;
    }
    
    .header h1 i {
      color: #FF6B35;
      font-size: 34px;
      animation: floatIcon 3s ease-in-out infinite;
    }
    
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    
    .header .subtitle {
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      font-weight: 500;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .header .stats-badge {
      background: linear-gradient(135deg, #FF6B35, #E55A2B);
      padding: 8px 20px;
      border-radius: 50px;
      color: white;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(255,107,53,0.3);
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .header .stats-badge .pulse-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
      animation: pulseDot 1.5s ease-in-out infinite;
    }
    
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.5); }
    }
    
    /* ===== بطاقات ===== */
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 28px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 30px;
      transition: all 0.4s ease;
    }
    
    .card:hover {
      box-shadow: 0 12px 48px rgba(0,0,0,0.4);
      border-color: rgba(255,107,53,0.15);
    }
    
    .card h2 {
      color: white;
      font-size: 1.4rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }
    
    .card h2 i {
      color: #FF6B35;
      font-size: 24px;
    }
    
    /* ===== نموذج ===== */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    
    .form-grid .full-width {
      grid-column: 1 / -1;
    }
    
    label {
      display: block;
      font-weight: 700;
      color: #e2e8f0;
      margin: 0 0 6px 0;
      font-size: 0.9rem;
    }
    
    label i {
      color: #FF6B35;
      margin-left: 6px;
    }
    
    input, textarea, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      font-size: 0.95rem;
      background: rgba(255,255,255,0.05);
      transition: all 0.3s ease;
      font-family: 'Tajawal', sans-serif;
      color: white;
    }
    
    input::placeholder, textarea::placeholder {
      color: rgba(255,255,255,0.3);
    }
    
    input:focus, textarea:focus, select:focus {
      border-color: #FF6B35;
      box-shadow: 0 0 0 4px rgba(255,107,53,0.12);
      outline: none;
      background: rgba(255,255,255,0.08);
    }
    
    select option {
      background: #1e293b;
      color: white;
    }
    
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    
    /* ===== أزرار ===== */
    .btn {
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      font-family: 'Tajawal', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #FF6B35, #E55A2B);
      color: white;
      box-shadow: 0 8px 24px rgba(255,107,53,0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(255,107,53,0.4);
    }
    
    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 8px 24px rgba(16,185,129,0.3);
    }
    
    .btn-success:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(16,185,129,0.4);
    }
    
    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      box-shadow: 0 8px 24px rgba(239,68,68,0.3);
    }
    
    .btn-danger:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(239,68,68,0.4);
    }
    
    .btn-outline {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.1);
      color: #cbd5e1;
    }
    
    .btn-outline:hover {
      border-color: #FF6B35;
      color: #FF6B35;
      background: rgba(255,107,53,0.05);
    }
    
    .btn-sm {
      padding: 6px 16px;
      font-size: 0.8rem;
    }
    
    .btn-block {
      width: 100%;
    }
    
    /* ===== محاضرات إضافية مع كويز ===== */
    .extra-lecture-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 18px 20px;
      margin-top: 14px;
      position: relative;
    }
    
    .extra-lecture-item .extra-number {
      position: absolute;
      top: -12px;
      right: 16px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 2px 18px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    
    .extra-lecture-item .quiz-toggle-sm {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0 8px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    
    .extra-lecture-item .quiz-toggle-sm .toggle-switch-sm {
      position: relative;
      width: 44px;
      height: 24px;
      background: rgba(255,255,255,0.1);
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }
    
    .extra-lecture-item .quiz-toggle-sm .toggle-switch-sm.active {
      background: #FF6B35;
    }
    
    .extra-lecture-item .quiz-toggle-sm .toggle-switch-sm::after {
      content: '';
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    
    .extra-lecture-item .quiz-toggle-sm .toggle-switch-sm.active::after {
      right: 22px;
    }
    
    .extra-lecture-item .quiz-toggle-sm span {
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 500;
    }
    
    .extra-lecture-item .quiz-questions-sm {
      margin-top: 10px;
      padding: 12px 14px;
      background: rgba(139,92,246,0.05);
      border-radius: 12px;
      border: 1px solid rgba(139,92,246,0.08);
    }
    
    .extra-lecture-item .quiz-questions-sm .question-sm {
      padding: 10px 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    
    .extra-lecture-item .quiz-questions-sm .question-sm .q-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    
    .extra-lecture-item .quiz-questions-sm .question-sm .q-head span {
      font-weight: 700;
      color: #a78bfa;
      font-size: 0.85rem;
    }
    
    .extra-lecture-item .quiz-questions-sm .question-sm .q-head button {
      background: rgba(239,68,68,0.15);
      color: #ef4444;
      border: none;
      padding: 2px 12px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: 'Tajawal', sans-serif;
    }
    
    .extra-lecture-item .quiz-questions-sm .question-sm .q-head button:hover {
      background: rgba(239,68,68,0.25);
    }
    
    .extra-lecture-item .quiz-questions-sm .question-sm input {
      padding: 8px 12px;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }
    
    .extra-lecture-item .quiz-questions-sm .question-sm .option-row-sm {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    
    .extra-lecture-item .quiz-questions-sm .question-sm .option-row-sm .opt-label {
      font-weight: 700;
      color: #94a3b8;
      width: 24px;
      font-size: 0.9rem;
    }
    
    .extra-lecture-item .quiz-questions-sm .question-sm .option-row-sm input {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.85rem;
    }
    
    .extra-lecture-item .removeBtn {
      background: rgba(239,68,68,0.15);
      color: #ef4444;
      border: 1px solid rgba(239,68,68,0.1);
      padding: 6px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      transition: all 0.3s ease;
      font-family: 'Tajawal', sans-serif;
      margin-top: 10px;
    }
    
    .extra-lecture-item .removeBtn:hover {
      background: rgba(239,68,68,0.25);
    }
    
    .extra-lecture-item .btn-add-question-sm {
      background: rgba(16,185,129,0.12);
      color: #34d399;
      border: 1px solid rgba(16,185,129,0.1);
      padding: 4px 14px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      transition: all 0.3s ease;
      font-family: 'Tajawal', sans-serif;
      margin-top: 6px;
    }
    
    .extra-lecture-item .btn-add-question-sm:hover {
      background: rgba(16,185,129,0.2);
    }
    
    /* ===== شبكة الفيديوهات ===== */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 10px;
    }
    
    .video-item {
      background: rgba(255,255,255,0.05);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.4s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    
    .video-item:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      border-color: rgba(255,107,53,0.2);
    }
    
    .video-item .image-wrapper {
      width: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      position: relative;
    }
    
    .video-item .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: all 0.5s ease;
    }
    
    .video-item:hover .image-wrapper img {
      transform: scale(1.06);
    }
    
    .video-item .image-wrapper .no-image {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #475569;
      font-size: 48px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
    }
    
    .video-item .video-number {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      color: #FF6B35;
      padding: 4px 16px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 900;
      border: 1px solid rgba(255,107,53,0.2);
    }
    
    .video-item .content-body {
      padding: 18px 20px 20px;
    }
    
    .video-item .title {
      font-weight: 900;
      color: white;
      font-size: 1.05rem;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    
    .video-item .description {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 12px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .video-item .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.75rem;
      color: #94a3b8;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .video-item .meta .badge {
      padding: 3px 12px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.7rem;
    }
    
    .badge-grade-1 { background: rgba(59,130,246,0.2); color: #60a5fa; border: 1px solid rgba(59,130,246,0.15); }
    .badge-grade-ba { background: rgba(251,191,36,0.2); color: #fbbf24; border: 1px solid rgba(251,191,36,0.15); }
    .badge-grade-az { background: rgba(52,211,153,0.2); color: #34d399; border: 1px solid rgba(52,211,153,0.15); }
    .badge-grade-3 { background: rgba(244,63,94,0.2); color: #fb7185; border: 1px solid rgba(244,63,94,0.15); }
    
    .badge-type-lecture { background: rgba(59,130,246,0.12); color: #60a5fa; border: 1px solid rgba(59,130,246,0.1); }
    .badge-type-course { background: rgba(139,92,246,0.12); color: #a78bfa; border: 1px solid rgba(139,92,246,0.1); }
    .badge-type-homework { background: rgba(251,191,36,0.12); color: #fbbf24; border: 1px solid rgba(251,191,36,0.1); }
    
    .badge-free { background: rgba(52,211,153,0.12); color: #34d399; border: 1px solid rgba(52,211,153,0.1); }
    .badge-paid { background: rgba(251,191,36,0.12); color: #fbbf24; border: 1px solid rgba(251,191,36,0.1); }
    
    .video-item .link {
      color: #FF6B35;
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    
    .video-item .link:hover {
      color: #f97316;
      gap: 10px;
    }
    
    .video-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 14px;
    }
    
    .video-actions .btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 0.8rem;
    }
    
    /* ===== عرض كويز المحاضرات الإضافية ===== */
    .extra-quiz-preview {
      margin-top: 8px;
      padding: 10px 12px;
      background: rgba(139,92,246,0.05);
      border-radius: 10px;
      border: 1px solid rgba(139,92,246,0.08);
    }
    
    .extra-quiz-preview .eq-title {
      font-weight: 700;
      color: #a78bfa;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    
    .extra-quiz-preview .eq-question {
      padding: 4px 8px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 0.78rem;
      border: 1px solid rgba(255,255,255,0.03);
      color: #cbd5e1;
    }
    
    .extra-quiz-preview .eq-question .eq-options {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 0.75rem;
    }
    
    .extra-quiz-preview .eq-question .eq-options span {
      background: rgba(255,255,255,0.03);
      padding: 1px 8px;
      border-radius: 4px;
    }
    
    .extra-quiz-preview .eq-question .eq-options .correct {
      background: rgba(52,211,153,0.12);
      color: #34d399;
      font-weight: 700;
    }
    
    .video-item .extra-lecture-display {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    
    .video-item .extra-lecture-display .el-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    
    .video-item .extra-lecture-display .el-item:last-child {
      border-bottom: none;
    }
    
    .video-item .extra-lecture-display .el-item .el-title {
      color: #e2e8f0;
      font-size: 0.85rem;
      font-weight: 500;
    }
    
    .video-item .extra-lecture-display .el-item .el-link {
      color: #FF6B35;
      font-size: 0.8rem;
    }
    
    /* ===== إحصائيات ===== */
    .video-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 12px;
      padding: 16px 20px;
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    
    .video-stats .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 500;
    }
    
    .video-stats .stat-item .stat-number {
      font-weight: 900;
      color: white;
      font-size: 1.15rem;
    }
    
    .video-stats .stat-item i {
      color: #FF6B35;
      font-size: 1rem;
    }
    
    /* ===== فلترة ===== */
    .filter-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
      padding: 14px 20px;
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.06);
    }
    
    .filter-tools input,
    .filter-tools select {
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      font-size: 0.85rem;
      background: rgba(255,255,255,0.03);
      color: white;
      min-width: 120px;
    }
    
    .filter-tools input {
      flex: 1;
      min-width: 160px;
    }
    
    .filter-tools input::placeholder {
      color: rgba(255,255,255,0.3);
    }
    
    .filter-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .filter-badge {
      padding: 4px 16px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      color: #94a3b8;
    }
    
    .filter-badge:hover {
      transform: scale(1.05);
      border-color: rgba(255,107,53,0.2);
    }
    
    .filter-badge.active {
      border-color: #FF6B35;
      background: rgba(255,107,53,0.1);
      color: #FF6B35;
      box-shadow: 0 0 20px rgba(255,107,53,0.08);
    }
    
    /* ===== تنبيهات ===== */
    #msg {
      margin-top: 14px;
      padding: 12px 20px;
      border-radius: 14px;
      text-align: center;
      font-weight: 700;
      display: none;
    }
    
    #msg.show {
      display: block;
      animation: slideInMsg 0.4s ease;
    }
    
    @keyframes slideInMsg {
      from { transform: translateY(-15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    #msg.success { background: rgba(52,211,153,0.12); color: #34d399; border: 1px solid rgba(52,211,153,0.15); }
    #msg.error { background: rgba(239,68,68,0.12); color: #ef4444; border: 1px solid rgba(239,68,68,0.15); }
    #msg.info { background: rgba(59,130,246,0.12); color: #60a5fa; border: 1px solid rgba(59,130,246,0.15); }
    
    /* ===== وضع التعديل ===== */
    .edit-mode-indicator {
      background: rgba(251,191,36,0.08);
      color: #fbbf24;
      padding: 10px 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: none;
      font-weight: 700;
      text-align: center;
      border: 1px solid rgba(251,191,36,0.1);
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .edit-mode-indicator.show {
      display: flex;
    }
    
    .edit-mode-indicator .cancel-edit {
      background: rgba(148,163,184,0.1);
      color: #94a3b8;
      border: 1px solid rgba(148,163,184,0.1);
      padding: 6px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.3s ease;
      font-family: 'Tajawal', sans-serif;
    }
    
    .edit-mode-indicator .cancel-edit:hover {
      background: rgba(148,163,184,0.2);
    }
    
    .loading-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
      color: #475569;
      font-size: 1rem;
      gap: 12px;
    }
    
    .loading-placeholder .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.05);
      border-top: 3px solid #FF6B35;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* ===== استجابة ===== */
    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      
      .header {
        flex-direction: column;
        text-align: center;
        padding: 20px;
      }
      
      .header .subtitle {
        justify-content: center;
      }
      
      .video-grid {
        grid-template-columns: 1fr;
      }
      
      .filter-tools {
        flex-direction: column;
        align-items: stretch;
      }
      
      .filter-tools input {
        min-width: auto;
      }
      
      .video-stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      
      .card {
        padding: 16px;
      }
      
      .video-actions {
        flex-direction: column;
      }
      
      .video-actions .btn {
        flex: none;
      }
      
      .video-stats {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>
<div class="app">
  
  <!-- ===== الهيدر ===== -->
  <div class="header">
    <h1>
      <i class="fas fa-video"></i>
      لوحة التحكم
    </h1>
    <div class="subtitle">
      <i class="fas fa-star" style="color: #FFD700;"></i>
      إدارة الفيديوهات والمحاضرات
      <span class="stats-badge">
        <span class="pulse-dot"></span>
        <span id="headerCount">0</span> محتوى
      </span>
    </div>
  </div>

  <!-- ===== نموذج الإضافة ===== -->
  <div class="card">
    <h2>
      <i id="formIcon" class="fas fa-plus-circle"></i>
      <span id="formTitle">إضافة فيديو جديد</span>
    </h2>
    
    <div id="editModeIndicator" class="edit-mode-indicator">
      <i class="fas fa-edit"></i>
      جاري تعديل الفيديو
      <button type="button" class="cancel-edit" id="cancelEdit">
        <i class="fas fa-times"></i> إلغاء
      </button>
    </div>
    
    <div id="numberDisplay" style="background:rgba(255,107,53,0.06);border:1px solid rgba(255,107,53,0.12);border-radius:40px;padding:10px 20px;text-align:center;color:#FF6B35;font-weight:700;margin-bottom:18px;">
      📌 الرقم التالي: <span id="nextNumber">...</span>
    </div>
    
    <form id="form">
      <input type="hidden" id="editId" value="" />
      
      <div class="form-grid">
        <div>
          <label><i class="fas fa-heading"></i> عنوان الفيديو</label>
          <input id="title" placeholder="مثال: شرح درس الكميات" required />
        </div>
        
        <div>
          <label><i class="fab fa-youtube"></i> رابط يوتيوب</label>
          <input id="link" type="url" placeholder="https://www.youtube.com/watch?v=..." required />
        </div>
        
        <div>
          <label><i class="fas fa-image"></i> رابط الصورة</label>
          <input id="image" type="url" placeholder="https://example.com/image.jpg" />
        </div>
        
        <div>
          <label><i class="fas fa-graduation-cap"></i> الصف الدراسي</label>
          <select id="grade">
            <option value="1">🚀 أولي بكالوريا</option>
            <option value="ba">📘 تانية بكالوريا</option>
            <option value="az">🕌 تانية ثانوي أزهر</option>
            <option value="3">📗 تالتة ثانوي</option>
          </select>
        </div>
        
        <div>
          <label><i class="fas fa-layer-group"></i> نوع المحتوى</label>
          <select id="contentType">
            <option value="lecture">📖 محاضرة</option>
            <option value="course">📚 كورس</option>
            <option value="homework">📋 واجب</option>
          </select>
        </div>
        
        <div>
          <label><i class="fas fa-tag"></i> نوع المحاضرة</label>
          <div style="display:flex;gap:10px;align-items:center;">
            <select id="priceType" style="flex:0 0 110px;">
              <option value="free">🆓 مجاني</option>
              <option value="paid">💰 مدفوع</option>
            </select>
            <input id="price" type="number" placeholder="السعر" value="0" disabled style="flex:1;" />
          </div>
        </div>
        
        <div class="full-width">
          <label><i class="fas fa-align-left"></i> الوصف</label>
          <textarea id="description" rows="2" placeholder="وصف مختصر للمحتوى"></textarea>
        </div>
      </div>

      <!-- ===== المحاضرات الإضافية مع كويز ===== -->
      <hr style="margin: 22px 0 16px; border: 1px solid rgba(255,255,255,0.06);" />
      
      <label style="color:#e2e8f0;font-size:1.05rem;"><i class="fas fa-list"></i> محاضرات إضافية</label>
      <div id="extraContainer"></div>
      <button type="button" id="addExtra" class="btn btn-outline btn-sm" style="margin-top:10px;">
        <i class="fas fa-plus"></i> أضف محاضرة إضافية
      </button>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:24px;" id="submitBtn">
        <i class="fas fa-save"></i> إضافة الفيديو
      </button>
    </form>
    <div id="msg"></div>
  </div>

  <!-- ===== عرض الفيديوهات ===== -->
  <div class="card">
    <h2><i class="fas fa-list-ul"></i> قائمة الفيديوهات</h2>
    
    <div class="video-stats">
      <span class="stat-item"><i class="fas fa-film"></i> <span class="stat-number" id="totalCount">0</span></span>
      <span class="stat-item"><i class="fas fa-rocket"></i> أولي: <span class="stat-number" id="grade1Count">0</span></span>
      <span class="stat-item"><i class="fas fa-book-open"></i> تانية: <span class="stat-number" id="gradeBaCount">0</span></span>
      <span class="stat-item"><i class="fas fa-mosque"></i> أزهر: <span class="stat-number" id="gradeAzCount">0</span></span>
      <span class="stat-item"><i class="fas fa-graduation-cap"></i> تالتة: <span class="stat-number" id="grade3Count">0</span></span>
    </div>

    <div class="filter-tools">
      <input type="text" id="searchInput" placeholder="🔍 بحث في العناوين..." />
      
      <select id="gradeFilter">
        <option value="all">📚 كل الصفوف</option>
        <option value="1">🚀 أولي بكالوريا</option>
        <option value="ba">📘 تانية بكالوريا</option>
        <option value="az">🕌 تانية ثانوي أزهر</option>
        <option value="3">📗 تالتة ثانوي</option>
      </select>

      <select id="typeFilter">
        <option value="all">📋 كل الأنواع</option>
        <option value="lecture">📖 محاضرة</option>
        <option value="course">📚 كورس</option>
        <option value="homework">📋 واجب</option>
      </select>

      <div class="filter-badges">
        <span class="filter-badge active" data-filter="all">📌 الكل</span>
        <span class="filter-badge" data-filter="course">📚 كورسات</span>
        <span class="filter-badge" data-filter="homework">📋 واجبات</span>
      </div>
    </div>

    <div id="videoList" class="video-grid">
      <div class="loading-placeholder">
        <div class="spinner"></div>
        جاري التحميل...
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
  import {
    getFirestore, collection, getDocs, query, orderBy, doc, setDoc, deleteDoc, getDoc
  } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBaezH8j4u0Kmum3poYuFk8LsGtVietnSM",
    authDomain: "viduo-corss.firebaseapp.com",
    projectId: "viduo-corss",
    storageBucket: "viduo-corss.firebasestorage.app",
    messagingSenderId: "485896854659",
    appId: "1:485896854659:web:f0a618235eb4d9e9784fb6",
    measurementId: "G-SVB0WMS9MW"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ===== العناصر =====
  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  const extraContainer = document.getElementById("extraContainer");
  const addExtraBtn = document.getElementById("addExtra");
  const nextNumberSpan = document.getElementById("nextNumber");
  const videoListEl = document.getElementById("videoList");
  const priceType = document.getElementById("priceType");
  const priceInput = document.getElementById("price");
  const editId = document.getElementById("editId");
  const formTitle = document.getElementById("formTitle");
  const formIcon = document.getElementById("formIcon");
  const submitBtn = document.getElementById("submitBtn");
  const editModeIndicator = document.getElementById("editModeIndicator");
  const cancelEditBtn = document.getElementById("cancelEdit");
  const searchInput = document.getElementById("searchInput");
  const gradeFilter = document.getElementById("gradeFilter");
  const typeFilter = document.getElementById("typeFilter");
  const filterBadges = document.querySelectorAll('.filter-badge');
  const headerCount = document.getElementById('headerCount');
  
  const totalCountEl = document.getElementById('totalCount');
  const grade1CountEl = document.getElementById('grade1Count');
  const gradeBaCountEl = document.getElementById('gradeBaCount');
  const gradeAzCountEl = document.getElementById('gradeAzCount');
  const grade3CountEl = document.getElementById('grade3Count');

  let isEditMode = false;
  let allVideos = [];
  let extraCounter = 0;
  let extraQuestionCounters = {};

  // ===== دالة عرض الرسائل =====
  function showMessage(text, type) {
    msg.textContent = text;
    msg.className = type + ' show';
    setTimeout(() => {
      msg.className = '';
      msg.textContent = '';
    }, 5000);
  }

  // ===== جلب الرقم التالي =====
  async function getNextNumber() {
    try {
      const q = query(collection(db, "videos"), orderBy("number", "desc"));
      const snap = await getDocs(q);
      let max = 0;
      snap.forEach(doc => {
        const data = doc.data();
        if (data.number && data.number > max) max = data.number;
      });
      return max + 1;
    } catch {
      return 1;
    }
  }

  // ===== عرض الصورة =====
  function getImageHtml(imageUrl) {
    if (imageUrl && imageUrl.trim()) {
      return `<img src="${imageUrl}" alt="صورة الفيديو" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=\\'no-image\\'><i class=\\'fas fa-image\\'></i></div>'" />`;
    }
    return `<div class="no-image"><i class="fas fa-image"></i></div>`;
  }

  // ===== الحصول على اسم الصف =====
  function getGradeLabel(grade) {
    const map = {
      '1': '🚀 أولي بكالوريا',
      'ba': '📘 تانية بكالوريا',
      'az': '🕌 تانية ثانوي أزهر',
      '3': '📗 تالتة ثانوي'
    };
    return map[grade] || grade;
  }

  function getGradeBadgeClass(grade) {
    const map = {
      '1': 'badge-grade-1',
      'ba': 'badge-grade-ba',
      'az': 'badge-grade-az',
      '3': 'badge-grade-3'
    };
    return map[grade] || 'badge-grade-1';
  }

  // ===== الحصول على نوع المحتوى =====
  function getContentTypeLabel(type) {
    const map = {
      'lecture': '📖 محاضرة',
      'course': '📚 كورس',
      'homework': '📋 واجب'
    };
    return map[type] || '📖 محاضرة';
  }

  function getTypeBadgeClass(type) {
    const map = {
      'lecture': 'badge-type-lecture',
      'course': 'badge-type-course',
      'homework': 'badge-type-homework'
    };
    return map[type] || 'badge-type-lecture';
  }

  // ===== عرض كويز المحاضرة الإضافية =====
  function renderExtraQuiz(quiz) {
    if (!quiz || quiz.length === 0) return '';
    let html = `<div class="extra-quiz-preview"><div class="eq-title"><i class="fas fa-brain"></i> كويز (${quiz.length} أسئلة)</div>`;
    quiz.forEach((q, idx) => {
      html += `
        <div class="eq-question">
          <span style="font-weight:700;color:#a78bfa;">${idx+1}.</span>
          <div class="eq-options">
            <span>أ: ${q.options?.a || ''}</span>
            <span>ب: ${q.options?.b || ''}</span>
            <span>ج: ${q.options?.c || ''}</span>
            <span>د: ${q.options?.d || ''}</span>
            <span class="correct">✅ ${q.correctAnswer === 'a' ? 'أ' : q.correctAnswer === 'b' ? 'ب' : q.correctAnswer === 'c' ? 'ج' : 'د'}</span>
          </div>
        </div>
      `;
    });
    html += `</div>`;
    return html;
  }

  // ===== عرض المحاضرات الإضافية =====
  function renderExtraLectures(lectures) {
    if (!lectures || lectures.length === 0) return '';
    let html = `<div class="extra-lecture-display">`;
    lectures.forEach((lec, idx) => {
      html += `
        <div class="el-item">
          <span style="color:#64748b;font-size:0.75rem;font-weight:700;">${idx+1}.</span>
          <span class="el-title">${lec.title || 'بدون عنوان'}</span>
          <a href="${lec.link || '#'}" target="_blank" class="el-link"><i class="fas fa-external-link-alt"></i></a>
          ${lec.quiz ? renderExtraQuiz(lec.quiz) : ''}
        </div>
      `;
    });
    html += `</div>`;
    return html;
  }

  // ===== تحميل الفيديوهات =====
  async function loadVideos() {
    try {
      const q = query(collection(db, "videos"), orderBy("number", "asc"));
      const snap = await getDocs(q);
      
      allVideos = [];
      snap.forEach(doc => {
        allVideos.push({
          id: doc.id,
          ...doc.data()
        });
      });

      updateStats(allVideos);
      headerCount.textContent = allVideos.length;
      applyFilters();
    } catch (err) {
      videoListEl.innerHTML = `<div class="loading-placeholder">⚠️ خطأ: ${err.message}</div>`;
    }
  }

  // ===== تحديث الإحصائيات =====
  function updateStats(videos) {
    const total = videos.length;
    const grade1 = videos.filter(v => v.grade === '1').length;
    const gradeBa = videos.filter(v => v.grade === 'ba').length;
    const gradeAz = videos.filter(v => v.grade === 'az').length;
    const grade3 = videos.filter(v => v.grade === '3').length;
    
    totalCountEl.textContent = total;
    grade1CountEl.textContent = grade1;
    gradeBaCountEl.textContent = gradeBa;
    gradeAzCountEl.textContent = gradeAz;
    grade3CountEl.textContent = grade3;
  }

  // ===== تطبيق الفلاتر =====
  function applyFilters() {
    const searchTerm = searchInput.value.trim().toLowerCase();
    const grade = gradeFilter.value;
    const type = typeFilter.value;
    const keywordFilter = document.querySelector('.filter-badge.active')?.dataset.filter || 'all';

    let filtered = allVideos;

    if (grade !== 'all') {
      filtered = filtered.filter(v => v.grade === grade);
    }

    if (type !== 'all') {
      filtered = filtered.filter(v => v.contentType === type);
    }

    if (keywordFilter === 'course') {
      filtered = filtered.filter(v => v.contentType === 'course');
    } else if (keywordFilter === 'homework') {
      filtered = filtered.filter(v => v.contentType === 'homework');
    }

    if (searchTerm) {
      filtered = filtered.filter(v => v.title && v.title.toLowerCase().includes(searchTerm));
    }

    displayVideos(filtered);
  }

  // ===== عرض الفيديوهات =====
  function displayVideos(videos) {
    if (videos.length === 0) {
      videoListEl.innerHTML = `<div class="loading-placeholder">🔍 لا توجد فيديوهات تطابق البحث</div>`;
      return;
    }

    let html = '';
    videos.forEach(video => {
      const isFree = video.priceType === 'free' || (!video.priceType && video.price === 0);
      const priceDisplay = isFree ? '🆓 مجاني' : `💰 ${video.price || 0} ج`;
      const gradeText = getGradeLabel(video.grade);
      const gradeBadge = getGradeBadgeClass(video.grade);
      const contentTypeLabel = getContentTypeLabel(video.contentType);
      const typeBadge = getTypeBadgeClass(video.contentType);
      const extraHtml = video.extraLectures?.length ? renderExtraLectures(video.extraLectures) : '';
      
      html += `
        <div class="video-item">
          <div class="image-wrapper">
            ${getImageHtml(video.image)}
            <div class="video-number">#${video.number || '?'}</div>
          </div>
          <div class="content-body">
            <div class="title">${video.title || 'بدون عنوان'}</div>
            ${video.description ? `<div class="description">${video.description}</div>` : ''}
            <div class="meta">
              <span class="badge ${gradeBadge}">${gradeText}</span>
              <span class="badge ${typeBadge}">${contentTypeLabel}</span>
              <span class="badge ${isFree ? 'badge-free' : 'badge-paid'}">${priceDisplay}</span>
              ${video.extraLectures?.length ? `<span class="badge" style="background:rgba(139,92,246,0.12);color:#a78bfa;border:1px solid rgba(139,92,246,0.1);">📚 +${video.extraLectures.length}</span>` : ''}
            </div>
            <a href="${video.link || '#'}" target="_blank" class="link">
              <i class="fab fa-youtube"></i> مشاهدة
            </a>
            ${extraHtml}
            <div class="video-actions">
              <button class="btn btn-primary btn-sm edit-btn" data-id="${video.id}">✏️ تعديل</button>
              <button class="btn btn-danger btn-sm delete-btn" data-id="${video.id}">🗑️ حذف</button>
            </div>
          </div>
        </div>
      `;
    });

    videoListEl.innerHTML = html;

    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => editVideo(btn.dataset.id));
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteVideo(btn.dataset.id));
    });
  }

  // ===== حذف فيديو =====
  async function deleteVideo(id) {
    if (!confirm('⚠️ هل أنت متأكد من حذف هذا الفيديو؟')) return;
    try {
      await deleteDoc(doc(db, "videos", id));
      showMessage('✅ تم حذف الفيديو بنجاح', 'success');
      await loadVideos();
      await updateNextNumber();
    } catch (err) {
      showMessage('❌ خطأ في الحذف: ' + err.message, 'error');
    }
  }

  // ===== تعديل فيديو =====
  async function editVideo(id) {
    try {
      const docRef = doc(db, "videos", id);
      const docSnap = await getDoc(docRef);
      if (!docSnap.exists()) {
        showMessage('⚠️ الفيديو غير موجود', 'error');
        return;
      }

      const data = docSnap.data();
      isEditMode = true;
      editId.value = id;
      
      document.getElementById('title').value = data.title || '';
      document.getElementById('description').value = data.description || '';
      document.getElementById('link').value = data.link || '';
      document.getElementById('image').value = data.image || '';
      document.getElementById('grade').value = data.grade || '1';
      document.getElementById('contentType').value = data.contentType || 'lecture';
      
      const isFree = data.priceType === 'free' || (!data.priceType && data.price === 0);
      priceType.value = isFree ? 'free' : 'paid';
      priceInput.value = data.price || 0;
      priceInput.disabled = isFree;

      // المحاضرات الإضافية مع كويزاتها
      extraContainer.innerHTML = '';
      extraCounter = 0;
      extraQuestionCounters = {};
      if (data.extraLectures && data.extraLectures.length > 0) {
        data.extraLectures.forEach((lec, idx) => {
          const key = `extra_${idx}`;
          extraQuestionCounters[key] = lec.quiz?.length || 0;
          addExtraLecture(lec.title, lec.link, lec.quiz || [], key);
        });
      }

      formTitle.textContent = 'تعديل الفيديو';
      formIcon.className = 'fas fa-edit';
      submitBtn.innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';
      editModeIndicator.classList.add('show');
      document.getElementById('numberDisplay').style.display = 'none';
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showMessage('✏️ جاري تعديل الفيديو #' + data.number, 'info');
    } catch (err) {
      showMessage('❌ خطأ في التحميل: ' + err.message, 'error');
    }
  }

  // ===== إلغاء التعديل =====
  cancelEditBtn.addEventListener('click', resetForm);

  function resetForm() {
    isEditMode = false;
    editId.value = '';
    form.reset();
    extraContainer.innerHTML = '';
    extraCounter = 0;
    extraQuestionCounters = {};
    priceInput.disabled = true;
    priceInput.value = 0;
    priceType.value = 'free';
    document.getElementById('contentType').value = 'lecture';
    
    formTitle.textContent = 'إضافة فيديو جديد';
    formIcon.className = 'fas fa-plus-circle';
    submitBtn.innerHTML = '<i class="fas fa-save"></i> إضافة الفيديو';
    editModeIndicator.classList.remove('show');
    document.getElementById('numberDisplay').style.display = 'block';
    showMessage('', '');
    updateNextNumber();
  }

  // ===== تحديث الرقم التالي =====
  async function updateNextNumber() {
    const num = await getNextNumber();
    nextNumberSpan.textContent = num;
  }

  // ===== إضافة محاضرة إضافية مع كويز =====
  function addExtraLecture(title = '', link = '', quizData = [], key = null) {
    extraCounter++;
    const id = key || `extra_${extraCounter}`;
    if (!extraQuestionCounters[id]) {
      extraQuestionCounters[id] = quizData.length || 0;
    }
    
    const div = document.createElement("div");
    div.classList.add("extra-lecture-item");
    div.dataset.id = id;
    
    let quizHtml = '';
    if (quizData.length > 0) {
      quizHtml = `
        <div class="quiz-questions-sm" id="quizContainer_${id}">
          ${quizData.map((q, idx) => `
            <div class="question-sm" data-qidx="${idx}">
              <div class="q-head">
                <span>سؤال ${idx+1}</span>
                <button type="button" class="remove-question-sm" onclick="this.closest('.question-sm').remove()">✕</button>
              </div>
              <input class="q-image-sm" type="url" placeholder="رابط صورة السؤال" value="${q.image || ''}" />
              <div class="option-row-sm"><span class="opt-label">أ</span><input class="opt-a-sm" placeholder="نص أ" value="${q.options?.a || ''}" /></div>
              <div class="option-row-sm"><span class="opt-label">ب</span><input class="opt-b-sm" placeholder="نص ب" value="${q.options?.b || ''}" /></div>
              <div class="option-row-sm"><span class="opt-label">ج</span><input class="opt-c-sm" placeholder="نص ج" value="${q.options?.c || ''}" /></div>
              <div class="option-row-sm"><span class="opt-label">د</span><input class="opt-d-sm" placeholder="نص د" value="${q.options?.d || ''}" /></div>
              <select class="correct-sm" style="width:100%;padding:6px 10px;margin-top:4px;border:2px solid rgba(255,255,255,0.06);border-radius:8px;background:rgba(255,255,255,0.03);color:white;font-family:'Tajawal',sans-serif;">
                <option value="a" ${q.correctAnswer === 'a' ? 'selected' : ''}>أ</option>
                <option value="b" ${q.correctAnswer === 'b' ? 'selected' : ''}>ب</option>
                <option value="c" ${q.correctAnswer === 'c' ? 'selected' : ''}>ج</option>
                <option value="d" ${q.correctAnswer === 'd' ? 'selected' : ''}>د</option>
              </select>
            </div>
          `).join('')}
        </div>
        <button type="button" class="btn-add-question-sm" onclick="addQuestionToExtra('${id}')">
          <i class="fas fa-plus"></i> إضافة سؤال
        </button>
      `;
    } else {
      quizHtml = `
        <div class="quiz-questions-sm" id="quizContainer_${id}" style="display:none;"></div>
        <button type="button" class="btn-add-question-sm" onclick="addQuestionToExtra('${id}')">
          <i class="fas fa-plus"></i> إضافة سؤال
        </button>
      `;
    }
    
    div.innerHTML = `
      <div class="extra-number">محاضرة ${extraCounter}</div>
      <label><i class="fas fa-heading"></i> عنوان المحاضرة</label>
      <input class="extra-title" value="${title}" required style="margin-bottom:10px;" />
      <label><i class="fab fa-youtube"></i> رابط يوتيوب</label>
      <input class="extra-link" type="url" value="${link}" placeholder="https://..." required />
      
      <div class="quiz-toggle-sm">
        <div class="toggle-switch-sm ${quizData.length > 0 ? 'active' : ''}" id="toggleExtraQuiz_${id}" onclick="toggleExtraQuiz('${id}')">
          <input type="checkbox" ${quizData.length > 0 ? 'checked' : ''} style="display:none;">
        </div>
        <span><i class="fas fa-brain" style="color:#a78bfa;"></i> كويز لهذه المحاضرة</span>
      </div>
      
      <div id="extraQuizContent_${id}" style="${quizData.length > 0 ? '' : 'display:none;'}">
        ${quizHtml}
      </div>
      
      <button type="button" class="removeBtn" onclick="this.closest('.extra-lecture-item').remove()"><i class="fas fa-trash"></i> إزالة</button>
    `;
    
    extraContainer.appendChild(div);
  }

  // ===== دوال الكويز للمحاضرات الإضافية (تصريح global) =====
  window.toggleExtraQuiz = function(id) {
    const toggle = document.getElementById(`toggleExtraQuiz_${id}`);
    const content = document.getElementById(`extraQuizContent_${id}`);
    const checkbox = toggle.querySelector('input');
    const isActive = toggle.classList.toggle('active');
    checkbox.checked = isActive;
    content.style.display = isActive ? 'block' : 'none';
    if (isActive) {
      const container = document.getElementById(`quizContainer_${id}`);
      if (container && container.children.length === 0) {
        addQuestionToExtra(id);
      }
    }
  };

  window.addQuestionToExtra = function(id) {
    const container = document.getElementById(`quizContainer_${id}`);
    if (!container) return;
    
    if (container.style.display === 'none') {
      container.style.display = 'block';
    }
    
    const qIdx = container.querySelectorAll('.question-sm').length;
    const qDiv = document.createElement('div');
    qDiv.classList.add('question-sm');
    qDiv.dataset.qidx = qIdx;
    qDiv.innerHTML = `
      <div class="q-head">
        <span>سؤال ${qIdx+1}</span>
        <button type="button" class="remove-question-sm" onclick="this.closest('.question-sm').remove()">✕</button>
      </div>
      <input class="q-image-sm" type="url" placeholder="رابط صورة السؤال" />
      <div class="option-row-sm"><span class="opt-label">أ</span><input class="opt-a-sm" placeholder="نص أ" /></div>
      <div class="option-row-sm"><span class="opt-label">ب</span><input class="opt-b-sm" placeholder="نص ب" /></div>
      <div class="option-row-sm"><span class="opt-label">ج</span><input class="opt-c-sm" placeholder="نص ج" /></div>
      <div class="option-row-sm"><span class="opt-label">د</span><input class="opt-d-sm" placeholder="نص د" /></div>
      <select class="correct-sm" style="width:100%;padding:6px 10px;margin-top:4px;border:2px solid rgba(255,255,255,0.06);border-radius:8px;background:rgba(255,255,255,0.03);color:white;font-family:'Tajawal',sans-serif;">
        <option value="a">أ</option>
        <option value="b">ب</option>
        <option value="c">ج</option>
        <option value="d">د</option>
      </select>
    `;
    container.appendChild(qDiv);
    
    // تحديث أرقام الأسئلة
    container.querySelectorAll('.question-sm').forEach((el, idx) => {
      el.querySelector('.q-head span').textContent = `سؤال ${idx+1}`;
    });
  };

  addExtraBtn.addEventListener("click", () => addExtraLecture());

  // ===== أحداث الفلترة =====
  searchInput.addEventListener('input', applyFilters);
  gradeFilter.addEventListener('change', applyFilters);
  typeFilter.addEventListener('change', applyFilters);

  filterBadges.forEach(badge => {
    badge.addEventListener('click', function() {
      filterBadges.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      applyFilters();
    });
  });

  // ===== التحكم في السعر =====
  priceType.addEventListener('change', function() {
    if (this.value === 'free') {
      priceInput.disabled = true;
      priceInput.value = 0;
    } else {
      priceInput.disabled = false;
      priceInput.value = '';
      priceInput.focus();
    }
  });

  // ===== تجميع بيانات كويز المحاضرة الإضافية =====
  function getExtraQuizData(container) {
    const questions = container.querySelectorAll('.question-sm');
    const quiz = [];
    questions.forEach(q => {
      const image = q.querySelector('.q-image-sm').value.trim();
      const a = q.querySelector('.opt-a-sm').value.trim();
      const b = q.querySelector('.opt-b-sm').value.trim();
      const c = q.querySelector('.opt-c-sm').value.trim();
      const d = q.querySelector('.opt-d-sm').value.trim();
      const correct = q.querySelector('.correct-sm').value;
      if (image && a && b && c && d) {
        quiz.push({
          image,
          options: { a, b, c, d },
          correctAnswer: correct
        });
      }
    });
    return quiz;
  }

  // ===== إرسال النموذج =====
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = document.getElementById("title").value.trim();
    const description = document.getElementById("description").value.trim();
    const link = document.getElementById("link").value.trim();
    const image = document.getElementById("image").value.trim();
    const grade = document.getElementById("grade").value;
    const contentType = document.getElementById("contentType").value;
    const priceTypeVal = priceType.value;
    const price = priceTypeVal === 'free' ? 0 : Number(priceInput.value) || 0;

    if (!title || !link) {
      showMessage("⚠️ العنوان والرابط مطلوبان", "error");
      return;
    }

    if (priceTypeVal === 'paid' && (!priceInput.value || Number(priceInput.value) <= 0)) {
      showMessage("⚠️ يرجى إدخال سعر صحيح للمحاضرة المدفوعة", "error");
      return;
    }

    // تجميع المحاضرات الإضافية مع كويزاتها
    const extraLectures = [];
    let hasError = false;
    document.querySelectorAll("#extraContainer .extra-lecture-item").forEach(div => {
      const t = div.querySelector(".extra-title").value.trim();
      const l = div.querySelector(".extra-link").value.trim();
      if (t && l) {
        const quizToggle = div.querySelector('.toggle-switch-sm');
        const hasQuiz = quizToggle && quizToggle.classList.contains('active');
        const quizContainer = div.querySelector('.quiz-questions-sm');
        let quiz = [];
        if (hasQuiz && quizContainer) {
          quiz = getExtraQuizData(quizContainer);
        }
        extraLectures.push({ title: t, link: l, quiz });
      }
    });

    try {
      const videoData = {
        title,
        description,
        link,
        image,
        grade,
        contentType,
        priceType: priceTypeVal,
        price: price,
        extraLectures,
        updatedAt: new Date().toISOString()
      };

      if (isEditMode) {
        const id = editId.value;
        await setDoc(doc(db, "videos", id), videoData, { merge: true });
        showMessage(`✅ تم تعديل الفيديو بنجاح`, "success");
        resetForm();
      } else {
        const nextNumber = await getNextNumber();
        await setDoc(doc(db, "videos", nextNumber.toString()), {
          ...videoData,
          number: nextNumber,
          createdAt: new Date().toISOString()
        });
        showMessage(`✅ تمت إضافة الفيديو #${nextNumber} بنجاح`, "success");
        form.reset();
        extraContainer.innerHTML = "";
        extraCounter = 0;
        extraQuestionCounters = {};
        priceInput.disabled = true;
        priceInput.value = 0;
        priceType.value = 'free';
        document.getElementById('contentType').value = 'lecture';
      }

      await loadVideos();
      await updateNextNumber();
    } catch (err) {
      showMessage("❌ خطأ: " + err.message, "error");
      console.error(err);
    }
  });

  // ===== التحميل الأولي =====
  await loadVideos();
  await updateNextNumber();

  // ===== منع الاختصارات =====


  console.log('🚀 لوحة التحكم المتطورة v3.0');
  console.log('📊 عدد الفيديوهات:', allVideos.length);

</script>
</body>
</html>
