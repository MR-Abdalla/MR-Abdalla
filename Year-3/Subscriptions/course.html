<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تفاصيل الكورس - مستر عبدالله السيد</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-black: #0a0a0a;
      --secondary-black: #1a1a1a;
      --accent-orange: #FF6B35;
      --accent-light-orange: #FF9E6D;
      --accent-dark-orange: #E55A2B;
      --gold: #FFA500;
      --light-gray: #f5f5f5;
      --text-white: #ffffff;
      --text-light: #e0e0e0;
      --border-dark: #333333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--primary-black);
      color: var(--text-light);
      line-height: 1.6;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* شعار المستر عبدالله السيد */
    .teacher-badge {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: linear-gradient(135deg, var(--accent-orange), #D35400);
      color: white;
      padding: 8px 15px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .teacher-badge i {
      font-size: 1.1rem;
    }

    /* الهيدر الرئيسي */
    .page-header {
      background: linear-gradient(135deg, var(--primary-black), #2A1A0A);
      color: white;
      padding: 20px 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
      border-bottom: 3px solid var(--accent-orange);
      position: relative;
      overflow: hidden;
    }

    .page-header h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: var(--text-white);
    }

    .page-header h1 span {
      color: var(--gold);
    }

    .page-header p {
      opacity: 0.9;
      font-size: 0.9rem;
    }

    .teacher-title {
      color: var(--accent-light-orange);
      font-weight: bold;
      margin-top: 5px;
      font-size: 1.1rem;
    }

    .container {
      max-width: 100%;
      margin: 0 auto;
      padding: 0 10px;
    }

    @media (min-width: 768px) {
      .container {
        max-width: 95%;
        padding: 0 15px;
      }
      .page-header {
        padding: 25px 20px;
      }
      .page-header h1 {
        font-size: 1.9rem;
      }
    }

    @media (min-width: 1200px) {
      .container {
        max-width: 1200px;
      }
    }

    .course-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 30px;
    }

    @media (min-width: 992px) {
      .course-container {
        flex-direction: row;
        gap: 25px;
      }
    }

    .main-content {
      flex: 1;
      background-color: var(--secondary-black);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-dark);
      width: 100%;
    }

    .sidebar {
      width: 100%;
      background-color: var(--secondary-black);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-dark);
    }

    @media (min-width: 992px) {
      .sidebar {
        width: 350px;
        flex-shrink: 0;
      }
    }

    /* رأس الكورس */
    .course-header {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--accent-orange);
    }

    @media (min-width: 768px) {
      .course-header {
        flex-direction: row;
        align-items: flex-start;
        gap: 20px;
      }
    }

    .course-image {
      width: 100%;
      max-width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
      border: 2px solid var(--accent-orange);
    }

    @media (min-width: 768px) {
      .course-image {
        width: 40%;
        max-width: 350px;
        margin-bottom: 0;
      }
    }

    .course-image img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.5s;
    }

    .course-image:hover img {
      transform: scale(1.03);
    }

    .course-info {
      flex: 1;
    }

    .course-title {
      color: var(--text-white);
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .course-description {
      margin-bottom: 15px;
      color: var(--text-light);
      font-size: 0.95rem;
    }

    .course-price {
      background: #ff7a2f;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      width: fit-content;
    }

    /* حاوية الفيديو */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      margin-bottom: 20px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      background-color: #000;
      border: 2px solid var(--accent-orange);
    }

    .video-frame {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      border: none;
    }

    /* بلاي ليست - تصميم حديث */
    .playlist-container {
      margin-top: 20px;
      background-color: #151515;
      border-radius: 12px;
      overflow: hidden;
    }

    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: linear-gradient(135deg, #1f1f1f, #2a2a2a);
      border-bottom: 2px solid var(--accent-orange);
      cursor: pointer;
    }

    .playlist-header h4 {
      color: var(--accent-light-orange);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .playlist-toggle {
      background: none;
      border: none;
      color: var(--accent-orange);
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .playlist-toggle.rotated {
      transform: rotate(180deg);
    }

    .playlist-items {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }

    .playlist-items.show {
      max-height: 500px;
      overflow-y: auto;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-dark);
      cursor: pointer;
      transition: all 0.3s;
    }

    .playlist-item:hover {
      background-color: #252525;
    }

    .playlist-item.active {
      background: linear-gradient(90deg, rgba(255,107,53,0.2), transparent);
      border-right: 3px solid var(--accent-orange);
    }

    .playlist-item.completed {
      opacity: 0.7;
    }

    .playlist-item.completed .playlist-play-icon {
      color: #4CAF50;
    }

    .playlist-number {
      width: 32px;
      height: 32px;
      background-color: var(--accent-orange);
      border-radius: 50%;
      display: flex;
    align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: white;
      flex-shrink: 0;
    }

    .playlist-info {
      flex: 1;
    }

    .playlist-title {
      font-size: 0.9rem;
      color: var(--text-white);
      margin-bottom: 4px;
      display: block;
    }

    .playlist-duration {
      font-size: 0.7rem;
      color: var(--text-light);
      opacity: 0.7;
    }

    .playlist-play-icon {
      color: var(--accent-orange);
      font-size: 1rem;
      flex-shrink: 0;
    }

    /* قائمة المحاضرات */
    .lectures-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    @media (min-width: 768px) {
      .lectures-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .lecture-card {
      background-color: #1f1f1f;
      border-radius: 12px;
      padding: 18px;
      border-right: 4px solid var(--accent-orange);
      border: 1px solid var(--border-dark);
      transition: all 0.3s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .lecture-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(255, 107, 53, 0.2);
    }

    .lecture-card.locked {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .lecture-card.completed {
      border-color: #4CAF50;
    }

    .lecture-number {
      background-color: var(--accent-orange);
      color: white;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .lecture-card-title {
      color: var(--text-white);
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .lecture-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      font-size: 0.85rem;
    }

    .lecture-status {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .status-locked { background-color: #555; color: #bbb; }
    .status-unlocked { background-color: rgba(76, 175, 80, 0.2); color: #a5d6a7; }
    .status-quiz { background-color: rgba(255, 107, 53, 0.2); color: var(--accent-light-orange); }

    /* صفحة المحاضرة */
    .lecture-page, .quiz-page {
      display: none;
      animation: fadeIn 0.5s;
    }
    .lecture-page.active, .quiz-page.active { display: block; }

    .lecture-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--accent-orange);
    }

    .lecture-title {
      color: var(--accent-light-orange);
      font-size: 1.3rem;
    }

    .back-to-list {
      display: inline-flex;
      align-items: center;
      background-color: #2a2a2a;
      color: var(--text-light);
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid var(--border-dark);
    }

    .back-to-list:hover {
      background-color: var(--accent-orange);
      color: white;
    }

    .lecture-resources {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    .resource-link {
      display: inline-flex;
      align-items: center;
      background-color: #2a2a2a;
      color: var(--text-light);
      padding: 10px 15px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.3s;
      cursor: pointer;
    }

    .resource-link:hover {
      background-color: var(--accent-orange);
      color: white;
      transform: translateY(-2px);
    }

    .resource-link i {
      margin-left: 8px;
    }

    /* الكويز */
    .quiz-question {
      background-color: #1f1f1f;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .quiz-question-image {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .quiz-question-text {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: var(--text-white);
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-option {
      padding: 14px 18px;
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      background-color: #2a2a2a;
    }

    .quiz-option:hover {
      background-color: #3a3a3a;
      border-color: #555;
    }

    .quiz-option.selected {
      border-color: var(--accent-orange);
      background-color: rgba(255, 107, 53, 0.1);
    }

    .quiz-progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 10px;
    }

    .quiz-navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
    }

    /* أزرار */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent-orange), #D35400);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      transition: all 0.3s;
      padding: 12px 20px;
      gap: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 107, 53, 0.5);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--accent-orange);
      color: var(--accent-orange);
    }

    .btn-outline:hover {
      background-color: var(--accent-orange);
      color: white;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* رسائل */
    .message {
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: center;
    }
    .message.success { background-color: rgba(76, 175, 80, 0.2); border: 1px solid #4CAF50; color: #a5d6a7; }
    .message.error { background-color: rgba(255, 107, 53, 0.2); border: 1px solid var(--accent-orange); color: #ffabab; }
    .message.info { background-color: rgba(33, 150, 243, 0.2); border: 1px solid #2196F3; color: #90caf9; }

    .loading {
      text-align: center;
      padding: 40px;
    }

    .progress-container { margin: 20px 0; }
    .progress-bar {
      height: 10px;
      background-color: #2a2a2a;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-orange), var(--accent-light-orange));
      width: 0%;
      transition: width 0.5s ease;
    }

    .mobile-menu-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 100;
      background-color: var(--accent-orange);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      display: none;
    }

    @media (max-width: 991px) {
      .mobile-menu-btn { display: flex; }
      .sidebar {
        position: fixed;
        top: 0;
        left: -280px;
        width: 280px;
        height: 100%;
        z-index: 1000;
        margin: 0;
        border-radius: 0;
        overflow-y: auto;
        transition: left 0.3s ease;
      }
      .sidebar.active { left: 0; }
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.7);
      z-index: 999;
    }
    .overlay.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: var(--accent-orange); border-radius: 4px; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="teacher-badge">
    <i class="fas fa-chalkboard-teacher"></i>
    <span>مستر عبدالله السيد</span>
  </div>

  <div class="page-header">
    <h1>منصة <span>مستر عبدالله السيد</span></h1>
    <p>تعليم ممتع وسهل - فيزياء وتكنولوجيا</p>
    <p class="teacher-title">خبير المنهج الدراسي</p>
  </div>

  <div class="container">
    <div id="courseBox" class="loading">
      <i class="fas fa-spinner fa-pulse"></i>
      <p>جارٍ تحميل بيانات الكورس...</p>
    </div>
    <div id="contentBox" style="display: none;"></div>
    <div id="lectureBox" style="display: none;"></div>
  </div>

  <footer style="background-color: var(--secondary-black); text-align: center; padding: 20px; margin-top: 30px;">
    <div>جميع الحقوق محفوظة © 2025 - مستر عبدالله السيد</div>
  </footer>

  <button class="mobile-menu-btn" id="mobileMenuBtn">
    <i class="fas fa-bars"></i>
  </button>
  <div class="overlay" id="overlay"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCC5aNDvRjMZFle2tFp3vY6kb74kjVp7Dg",
      authDomain: "subscriptions-f84ee.firebaseapp.com",
      projectId: "subscriptions-f84ee",
      storageBucket: "subscriptions-f84ee.firebasestorage.app",
      messagingSenderId: "425125909485",
      appId: "1:425125909485:web:1dcdf4989d35e5e53c8de4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get("id");

    let courseData = null;
    let currentLectureIndex = 0;
    let currentQuizIndex = 0;
    let quizAnswers = [];
    let studentProgress = {};
    let currentVideoIndex = 0;

    function getYouTubeEmbedUrl(url) {
      if (!url) return '';
      let videoId = '';
      if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
      else if (url.includes('youtube.com/watch?v=')) videoId = url.split('v=')[1]?.split('&')[0];
      else if (url.includes('youtube.com/embed/')) videoId = url.split('embed/')[1]?.split('?')[0];
      if (videoId && videoId.length === 11) return `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
      return url;
    }

    function setupMobileMenu() {
      const btn = document.getElementById('mobileMenuBtn');
      const overlay = document.getElementById('overlay');
      const sidebar = document.querySelector('.sidebar');
      if (btn) btn.onclick = () => { sidebar?.classList.add('active'); overlay?.classList.add('active'); };
      if (overlay) overlay.onclick = () => { sidebar?.classList.remove('active'); overlay.classList.remove('active'); };
    }

    async function loadCourse() {
      const snap = await getDoc(doc(db, "courses", courseId));
      if (!snap.exists()) {
        document.getElementById("courseBox").innerHTML = `<div class="message error">الكورس غير موجود</div>`;
        return;
      }
      courseData = snap.data();
      const progressKey = `course_${courseId}_progress`;
      const saved = localStorage.getItem(progressKey);
      studentProgress = saved ? JSON.parse(saved) : { completedLectures: [], quizResults: {} };
      
      if (courseData.price === 0) {
        showCourseContent();
        return;
      }
      
      const studentData = JSON.parse(localStorage.getItem("studentData"));
      if (!studentData) { renderCodeInput(); return; }
      
      const q = query(collection(db, "codes"), where("courseId", "==", courseId), where("isUsed", "==", true));
      const snapCodes = await getDocs(q);
      const activated = snapCodes.docs.some(doc => doc.data().usedBy?.studentId === studentData.studentId);
      activated ? showCourseContent() : renderCodeInput();
    }

    function renderCodeInput() {
      document.getElementById("courseBox").innerHTML = `
        <div class="course-container">
          <div class="main-content">
            <div class="course-header">
              <div class="course-image"><img src="${courseData.image}" alt="${courseData.title}"></div>
              <div class="course-info">
                <h1 class="course-title">${courseData.title}</h1>
                <p class="course-description">${courseData.description}</p>
                <div class="course-price"><i class="fas fa-tag"></i> السعر: ${courseData.price} ريال</div>
              </div>
            </div>
          </div>
          <div class="sidebar">
            <h3><i class="fas fa-key"></i> تفعيل الكورس</h3>
            <input type="text" id="codeInput" placeholder="أدخل كود التفعيل" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; background:#2a2a2a; color:white; border:1px solid #333;">
            <button class="btn" onclick="window.checkCode()" style="width:100%"><i class="fas fa-check"></i> تفعيل</button>
            <div id="msg"></div>
          </div>
        </div>
      `;
      setupMobileMenu();
    }

    window.checkCode = async function() {
      const code = document.getElementById("codeInput").value.trim();
      const msgDiv = document.getElementById("msg");
      const studentData = JSON.parse(localStorage.getItem("studentData"));
      if (!studentData) { msgDiv.innerHTML = '<div class="message error">يرجى تسجيل الدخول أولاً</div>'; return; }
      
      const q = query(collection(db, "codes"), where("courseId", "==", courseId), where("code", "==", code));
      const snap = await getDocs(q);
      if (snap.empty) { msgDiv.innerHTML = '<div class="message error">كود غير صحيح</div>'; return; }
      
      const docRef = snap.docs[0].ref;
      const data = snap.docs[0].data();
      if (data.isUsed && data.usedBy?.studentId !== studentData.studentId) { msgDiv.innerHTML = '<div class="message error">الكود مستخدم من قبل</div>'; return; }
      
      await updateDoc(docRef, { isUsed: true, usedBy: { ...studentData, id: snap.docs[0].id }, usedAt: new Date().toISOString() });
      msgDiv.innerHTML = '<div class="message success">تم التفعيل بنجاح!</div>';
      setTimeout(() => showCourseContent(), 1500);
    };

    function showCourseContent() {
      document.getElementById("courseBox").style.display = "none";
      document.getElementById("contentBox").style.display = "block";
      
      const lectures = courseData.lectures || [];
      const completed = studentProgress.completedLectures || [];
      const progressPercent = lectures.length ? Math.round((completed.length / lectures.length) * 100) : 0;
      
      let lecturesHTML = "";
      lectures.forEach((lec, idx) => {
        const isCompleted = completed.includes(idx);
        const isUnlocked = idx === 0 || completed.includes(idx - 1);
        let statusClass = isCompleted ? "status-unlocked" : (isUnlocked ? "status-quiz" : "status-locked");
        let statusText = isCompleted ? "مكتمل" : (isUnlocked ? "جاهز" : "مقفل");
        lecturesHTML += `
          <div class="lecture-card ${!isUnlocked ? 'locked' : ''} ${isCompleted ? 'completed' : ''}" onclick="${isUnlocked ? `selectLecture(${idx})` : ''}">
            <div class="lecture-number">${idx+1}</div>
            <h3 class="lecture-card-title">${lec.title}</h3>
            <div class="lecture-meta"><div class="lecture-status ${statusClass}">${statusText}</div></div>
          </div>
        `;
      });
      
      document.getElementById("contentBox").innerHTML = `
        <div class="course-container">
          <div class="main-content">
            <div class="course-header">
              <div class="course-image"><img src="${courseData.image}" alt="${courseData.title}"></div>
              <div class="course-info">
                <h1 class="course-title">${courseData.title}</h1>
                <p class="course-description">${courseData.description}</p>
                <div class="progress-container">
                  <div class="progress-text"><span>تقدمك</span><span>${completed.length}/${lectures.length} (${progressPercent}%)</span></div>
                  <div class="progress-bar"><div class="progress-fill" style="width:${progressPercent}%"></div></div>
                </div>
              </div>
            </div>
            <h3 style="color:var(--accent-light-orange); margin-bottom:15px;"><i class="fas fa-list-ol"></i> المحاضرات</h3>
            <div class="lectures-list">${lecturesHTML}</div>
          </div>
          <div class="sidebar">
            <h3 style="color:var(--accent-light-orange);">معلومات الكورس</h3>
            <div style="background:#2a2a2a; padding:15px; border-radius:10px; margin-bottom:20px;">
              <div>📚 عدد المحاضرات: ${lectures.length}</div>
              <div>🎬 فيديوهات: ${lectures.reduce((s,l)=> s + (l.videos?.length || 1), 0)}</div>
              <div>❓ اختبارات: ${lectures.reduce((s,l)=> s + (l.quiz?.length || 0), 0)}</div>
            </div>
            <h3 style="color:var(--accent-light-orange);">نصائح مستر عبدالله</h3>
            <div style="background:#2a2a2a; padding:15px; border-radius:10px;">
              <p>✅ حل الكويز قبل كل محاضرة</p>
              <p>✅ شاهد الفيديوهات بتركيز</p>
              <p>✅ دون الملاحظات</p>
            </div>
          </div>
        </div>
      `;
      setupMobileMenu();
    }

    window.selectLecture = function(idx) {
      currentLectureIndex = idx;
      const lecture = courseData.lectures[idx];
      const quizCompleted = studentProgress.quizResults?.[idx] === true;
      if (lecture.quiz?.length && !quizCompleted && idx !== 0 && !studentProgress.completedLectures?.includes(idx-1)) {
        alert("⚠️ يجب إكمال المحاضرة السابقة أولاً!");
        return;
      }
      if (lecture.quiz?.length && !quizCompleted) showQuiz(idx);
      else showLecture(idx);
    };

    function showQuiz(lectureIndex) {
      const lecture = courseData.lectures[lectureIndex];
      const quiz = lecture.quiz;
      quizAnswers = new Array(quiz.length).fill(null);
      currentQuizIndex = 0;
      
      document.getElementById("contentBox").style.display = "none";
      document.getElementById("lectureBox").style.display = "block";
      document.getElementById("lectureBox").innerHTML = `
        <div class="course-container">
          <div class="main-content">
            <div class="quiz-page active">
              <div class="quiz-header"><h2>📝 اختبار المحاضرة ${lectureIndex+1}</h2><p>${lecture.title}</p></div>
              <div class="quiz-progress"><span>السؤال <span id="currentQ">1</span>/${quiz.length}</span><span>الإجابات <span id="answeredCount">0</span>/${quiz.length}</span></div>
              <div id="quizContent"></div>
              <div class="quiz-navigation">
                <button class="btn-outline btn" id="prevBtn" onclick="changeQ(-1)" disabled><i class="fas fa-arrow-right"></i> السابق</button>
                <button class="btn" id="nextBtn" onclick="changeQ(1)">التالي <i class="fas fa-arrow-left"></i></button>
              </div>
              <div style="text-align:center; margin-top:20px;"><button class="btn" id="submitQuizBtn" onclick="submitQuizAnswers(${lectureIndex})" style="display:none;"><i class="fas fa-check"></i> تأكيد الإجابات</button></div>
            </div>
          </div>
          <div class="sidebar">
            <h3>📌 تعليمات</h3>
            <div style="background:#2a2a2a; padding:15px; border-radius:10px;">
              <p>✅ اختر الإجابة الصحيحة لكل سؤال</p>
              <p>✅ يجب الإجابة على جميع الأسئلة بشكل صحيح</p>
              <button class="btn-outline btn" onclick="cancelQuiz()" style="margin-top:15px;">إلغاء</button>
            </div>
          </div>
        </div>
      `;
      updateQuizDisplay();
      setupMobileMenu();
      
      document.getElementById("prevBtn").onclick = () => changeQ(-1);
      document.getElementById("nextBtn").onclick = () => changeQ(1);
    }

    function updateQuizDisplay() {
      const quiz = courseData.lectures[currentLectureIndex].quiz;
      const q = quiz[currentQuizIndex];
      const answered = quizAnswers.filter(a => a !== null).length;
      document.getElementById("currentQ").innerText = currentQuizIndex+1;
      document.getElementById("answeredCount").innerText = answered;
      document.getElementById("prevBtn").disabled = currentQuizIndex === 0;
      document.getElementById("nextBtn").style.display = currentQuizIndex < quiz.length-1 ? "inline-flex" : "none";
      document.getElementById("submitQuizBtn").style.display = answered === quiz.length ? "inline-flex" : "none";
      
      const container = document.getElementById("quizContent");
      container.innerHTML = `
        <div class="quiz-question">
          ${q.questionImage ? `<img src="${q.questionImage}" class="quiz-question-image">` : ''}
          <div class="quiz-question-text">${q.question || "اختر الإجابة الصحيحة"}</div>
          <div class="quiz-options">
            ${q.options.map((opt, i) => `<div class="quiz-option ${quizAnswers[currentQuizIndex] === i ? 'selected' : ''}" onclick="selectAnswer(${i})">${opt.text}</div>`).join('')}
          </div>
        </div>
      `;
    }

    window.selectAnswer = function(i) {
      quizAnswers[currentQuizIndex] = i;
      updateQuizDisplay();
    };
    
    window.changeQ = function(dir) {
      currentQuizIndex += dir;
      if (currentQuizIndex < 0) currentQuizIndex = 0;
      if (currentQuizIndex >= courseData.lectures[currentLectureIndex].quiz.length) currentQuizIndex = courseData.lectures[currentLectureIndex].quiz.length - 1;
      updateQuizDisplay();
    };
    
    window.submitQuizAnswers = function(lectureIndex) {
      const quiz = courseData.lectures[lectureIndex].quiz;
      let correct = 0;
      for(let i=0; i<quiz.length; i++) if(quizAnswers[i] === quiz[i].correct) correct++;
      if(correct === quiz.length) {
        if(!studentProgress.quizResults) studentProgress.quizResults = {};
        studentProgress.quizResults[lectureIndex] = true;
        localStorage.setItem(`course_${courseId}_progress`, JSON.stringify(studentProgress));
        alert("🎉 مبروك! إجاباتك صحيحة، تم فتح المحاضرة!");
        showLecture(lectureIndex);
      } else {
        alert(`❌ نتيجتك: ${correct}/${quiz.length}\nيجب الإجابة على جميع الأسئلة بشكل صحيح`);
      }
    };
    
    window.cancelQuiz = function() {
      document.getElementById("lectureBox").style.display = "none";
      document.getElementById("contentBox").style.display = "block";
    };

    function showLecture(lectureIndex) {
      const lecture = courseData.lectures[lectureIndex];
      if(!studentProgress.completedLectures?.includes(lectureIndex)) {
        studentProgress.completedLectures = studentProgress.completedLectures || [];
        studentProgress.completedLectures.push(lectureIndex);
        localStorage.setItem(`course_${courseId}_progress`, JSON.stringify(studentProgress));
      }
      
      const videos = lecture.videos?.length ? lecture.videos : (lecture.videoLink ? [{title: "فيديو الشرح", url: lecture.videoLink}] : []);
      const hasHomework = !!lecture.homeworkVideo;
      const allVideos = [...videos];
      if(hasHomework) allVideos.push({title: "📝 فيديو الواجب", url: lecture.homeworkVideo, isHomework: true});
      
      document.getElementById("contentBox").style.display = "none";
      document.getElementById("lectureBox").style.display = "block";
      
      let playlistHTML = "";
      allVideos.forEach((v, idx) => {
        playlistHTML += `
          <div class="playlist-item" onclick="switchToPlaylistVideo(${idx})" data-video-index="${idx}">
            <div class="playlist-number">${idx+1}</div>
            <div class="playlist-info">
              <span class="playlist-title">${v.title || `فيديو ${idx+1}`}</span>
              <span class="playlist-duration">${v.isHomework ? 'واجب منزلي' : 'شرح'}</span>
            </div>
            <i class="fas fa-play-circle playlist-play-icon"></i>
          </div>
        `;
      });
      
      document.getElementById("lectureBox").innerHTML = `
        <div class="course-container">
          <div class="main-content">
            <div class="lecture-page active">
              <div class="lecture-header">
                <h2 class="lecture-title"><i class="fas fa-chalkboard-teacher"></i> ${lecture.title}</h2>
                <button class="back-to-list" onclick="backToLecturesList()"><i class="fas fa-arrow-right"></i> العودة</button>
              </div>
              <div class="video-container">
                <iframe id="mainVideo" class="video-frame" src="${getYouTubeEmbedUrl(allVideos[0]?.url)}" frameborder="0" allowfullscreen></iframe>
              </div>
              <div class="lecture-resources">
                ${lecture.pdfLink ? `<a href="${lecture.pdfLink}" target="_blank" class="resource-link"><i class="fas fa-file-pdf"></i> PDF</a>` : ''}
                ${lecture.images?.length ? `<a href="#" class="resource-link" onclick="showImages(${lectureIndex}); return false;"><i class="fas fa-images"></i> صور (${lecture.images.length})</a>` : ''}
              </div>
              <div class="playlist-container">
                <div class="playlist-header" onclick="togglePlaylist()">
                  <h4><i class="fas fa-list"></i> قائمة التشغيل (${allVideos.length})</h4>
                  <i class="fas fa-chevron-down playlist-toggle" id="playlistToggle"></i>
                </div>
                <div class="playlist-items" id="playlistItems">
                  ${playlistHTML}
                </div>
              </div>
            </div>
          </div>
          <div class="sidebar">
            <h3 style="color:var(--accent-light-orange);">💡 نصائح للمشاهدة</h3>
            <div style="background:#2a2a2a; padding:15px; border-radius:10px;">
              <p>⭐ شاهد الفيديوهات بالترتيب</p>
              <p>⭐ استخدم قائمة التشغيل للتنقل</p>
              <p>⭐ دون الملاحظات المهمة</p>
            </div>
          </div>
        </div>
      `;
      
      setupMobileMenu();
      window.playlistVideos = allVideos;
      window.currentPlaylistIndex = 0;
      window.togglePlaylist = function() {
        const items = document.getElementById("playlistItems");
        const toggle = document.getElementById("playlistToggle");
        items.classList.toggle("show");
        toggle.classList.toggle("rotated");
      };
      
      window.switchToPlaylistVideo = function(idx) {
        window.currentPlaylistIndex = idx;
        const video = window.playlistVideos[idx];
        const iframe = document.getElementById("mainVideo");
        if(iframe) iframe.src = getYouTubeEmbedUrl(video.url);
        document.querySelectorAll('.playlist-item').forEach((item, i) => {
          if(i === idx) item.classList.add('active');
          else item.classList.remove('active');
        });
        if(window.playlistItems) document.getElementById("playlistItems")?.classList.remove('show');
      };
      
      document.querySelectorAll('.playlist-item')[0]?.classList.add('active');
      setTimeout(() => {
        const items = document.getElementById("playlistItems");
        if(items) items.classList.add("show");
      }, 100);
    }
    
    window.switchToPlaylistVideo = function(idx) {
      const video = window.playlistVideos[idx];
      const iframe = document.getElementById("mainVideo");
      if(iframe) iframe.src = getYouTubeEmbedUrl(video.url);
      document.querySelectorAll('.playlist-item').forEach((item, i) => {
        if(i === idx) item.classList.add('active');
        else item.classList.remove('active');
      });
    };
    
    window.showImages = function(lectureIndex) {
      const images = courseData.lectures[lectureIndex].images;
      const modal = document.createElement('div');
      modal.style.cssText = 'position:fixed; top:0; right:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px;';
      modal.innerHTML = `
        <div style="background:#1a1a1a; border-radius:15px; padding:20px; max-width:600px; width:100%; max-height:80vh; overflow-y:auto;">
          <div style="display:flex; justify-content:space-between; margin-bottom:15px;"><h3 style="color:var(--accent-orange);">صور المحاضرة</h3><button onclick="this.closest('div').parentElement.remove()" style="background:none; border:none; color:white; font-size:20px;">✖</button></div>
          ${images.map(img => `<img src="${img}" style="width:100%; margin-bottom:10px; border-radius:8px;">`).join('')}
          <button class="btn" onclick="this.closest('div').parentElement.remove()" style="width:100%; margin-top:10px;">إغلاق</button>
        </div>
      `;
      document.body.appendChild(modal);
    };
    
    window.backToLecturesList = function() {
      document.getElementById("lectureBox").style.display = "none";
      document.getElementById("contentBox").style.display = "block";
      showCourseContent();
    };
    
    loadCourse();
  </script>
  <script>
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("keydown", e => {
      if(e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || (e.ctrlKey && e.key === "U")) e.preventDefault();
    });
  </script>
</body>
</html>
