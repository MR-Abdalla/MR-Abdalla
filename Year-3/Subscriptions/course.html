<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تفاصيل الكورس - مستر عبدالله السيد</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-black: #0a0a0a;
      --secondary-black: #1a1a1a;
      --accent-orange: #FF6B35;
      --accent-light-orange: #FF9E6D;
      --accent-dark-orange: #E55A2B;
      --gold: #FFA500;
      --light-gray: #f5f5f5;
      --text-white: #ffffff;
      --text-light: #e0e0e0;
      --border-dark: #333333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--primary-black);
      color: var(--text-light);
      line-height: 1.6;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* شعار المستر عبدالله السيد */
    .teacher-badge {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: linear-gradient(135deg, var(--accent-orange), #D35400);
      color: white;
      padding: 8px 15px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .teacher-badge i {
      font-size: 1.1rem;
    }

    /* الهيدر الرئيسي */
    .page-header {
      background: linear-gradient(135deg, var(--primary-black), #2A1A0A);
      color: white;
      padding: 20px 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
      border-bottom: 3px solid var(--accent-orange);
      position: relative;
      overflow: hidden;
    }

    .page-header::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/100" preserveAspectRatio="none"><path d="M0,0 L100,0 L100,100 Z" fill="%23FF6B35" opacity="0.1"/></svg>');
      background-size: cover;
      pointer-events: none;
    }

    .page-header h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: var(--text-white);
      position: relative;
    }

    .page-header h1 span {
      color: var(--gold);
    }

    .page-header p {
      opacity: 0.9;
      font-size: 0.9rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .teacher-title {
      color: var(--accent-light-orange);
      font-weight: bold;
      margin-top: 5px;
      font-size: 1.1rem;
    }

    .container {
      max-width: 100%;
      margin: 0 auto;
      padding: 0 10px;
    }

    @media (min-width: 768px) {
      .container {
        max-width: 95%;
        padding: 0 15px;
      }
      
      .page-header {
        padding: 25px 20px;
      }
      
      .page-header h1 {
        font-size: 1.9rem;
      }
    }

    @media (min-width: 1200px) {
      .container {
        max-width: 1200px;
      }
    }

    /* تصميم متجاوب للهاتف أولاً */
    .course-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 30px;
    }

    @media (min-width: 992px) {
      .course-container {
        flex-direction: row;
        gap: 25px;
      }
    }

    .main-content {
      flex: 1;
      background-color: var(--secondary-black);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-dark);
      width: 100%;
    }

    .sidebar {
      width: 100%;
      background-color: var(--secondary-black);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-dark);
    }

    @media (min-width: 992px) {
      .sidebar {
        width: 350px;
        flex-shrink: 0;
      }
    }

    /* رأس الكورس */
    .course-header {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--accent-orange);
    }

    @media (min-width: 768px) {
      .course-header {
        flex-direction: row;
        align-items: flex-start;
        gap: 20px;
      }
    }

    .course-image {
      width: 100%;
      max-width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
      border: 2px solid var(--accent-orange);
    }

    @media (min-width: 768px) {
      .course-image {
        width: 40%;
        max-width: 350px;
        margin-bottom: 0;
      }
    }

    .course-image img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.5s;
    }

    .course-image:hover img {
      transform: scale(1.03);
    }

    .course-info {
      flex: 1;
    }

    .course-title {
      color: var(--text-white);
      font-size: 1.5rem;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    @media (min-width: 768px) {
      .course-title {
        font-size: 1.7rem;
      }
    }

    .course-description {
      margin-bottom: 15px;
      color: var(--text-light);
      font-size: 0.95rem;
    }

    .course-price {
      background: #ff7a2f;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      width: fit-content;
      max-width: 100%;
      transition: 0.2s ease;
    }

    .course-price:hover {
      transform: scale(1.03);
    }

    /* حاوية الفيديو متجاوبة */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      margin-bottom: 20px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      background-color: #000;
      border: 2px solid var(--accent-orange);
    }

    .video-placeholder {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1A0A0A, #2A1A0A);
      color: white;
      text-align: center;
    }

    .video-placeholder i {
      font-size: 3rem;
      color: var(--accent-orange);
      margin-bottom: 15px;
    }

    .video-placeholder p {
      font-size: 1rem;
      opacity: 0.9;
      max-width: 300px;
    }

    /* تخصيص الفيديو إطار */
    .video-frame {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      border: none;
    }

    /* قائمة المحاضرات */
    .lectures-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    @media (min-width: 768px) {
      .lectures-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .lecture-card {
      background-color: #1f1f1f;
      border-radius: 12px;
      padding: 18px;
      border-right: 4px solid var(--accent-orange);
      border: 1px solid var(--border-dark);
      transition: all 0.3s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .lecture-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(255, 107, 53, 0.2);
      border-color: var(--accent-light-orange);
    }

    .lecture-card.locked {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .lecture-card.completed {
      border-color: #4CAF50;
    }

    .lecture-number {
      background-color: var(--accent-orange);
      color: white;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .lecture-card-title {
      color: var(--text-white);
      font-size: 1.1rem;
      margin-bottom: 10px;
      flex-grow: 1;
    }

    .lecture-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      font-size: 0.85rem;
      color: var(--text-light);
    }

    .lecture-status {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .status-locked {
      background-color: #555;
      color: #bbb;
    }

    .status-unlocked {
      background-color: rgba(76, 175, 80, 0.2);
      color: #a5d6a7;
    }

    .status-quiz {
      background-color: rgba(255, 107, 53, 0.2);
      color: var(--accent-light-orange);
    }

    /* صفحة المحاضرة */
    .lecture-page {
      display: none;
      animation: fadeIn 0.5s;
    }

    .lecture-page.active {
      display: block;
    }

    .lecture-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--accent-orange);
    }

    .back-to-list {
      display: inline-flex;
      align-items: center;
      background-color: #2a2a2a;
      color: var(--text-light);
      padding: 8px 15px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.3s;
      border: 1px solid var(--border-dark);
      font-size: 0.8rem;
    }

    .back-to-list:hover {
      background-color: var(--accent-orange);
      color: white;
    }

    .back-to-list i {
      margin: 5px;
    }

    .lecture-resources {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    .resource-link {
      display: inline-flex;
      align-items: center;
      background-color: #2a2a2a;
      color: var(--text-light);
      padding: 10px 15px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.3s;
      border: 1px solid var(--border-dark);
      font-size: 14px;
      cursor: pointer;
    }

    .resource-link:hover {
      background-color: var(--accent-orange);
      color: white;
      transform: translateY(-2px);
    }

    .resource-link i {
      margin-left: 8px;
    }

    /* علامات تبويب الفيديو */
    .video-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 2px solid var(--border-dark);
      padding-bottom: 10px;
    }

    .video-tab {
      padding: 8px 16px;
      background-color: #2a2a2a;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
      color: var(--text-light);
      border: 1px solid transparent;
      font-size: 14px;
    }

    .video-tab:hover {
      background-color: #3a3a3a;
    }

    .video-tab.active {
      background-color: var(--accent-orange);
      color: white;
      border-color: var(--accent-light-orange);
    }

    /* صفحة الكويز */
    .quiz-page {
      display: none;
      animation: fadeIn 0.5s;
    }

    .quiz-page.active {
      display: block;
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--accent-orange);
    }

    .quiz-progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 10px;
    }

    .quiz-question {
      background-color: #1f1f1f;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border-dark);
    }

    .quiz-question-image {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 15px;
      display: block;
    }

    .quiz-question-text {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: var(--text-white);
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-option {
      padding: 14px 18px;
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      background-color: #2a2a2a;
      font-size: 0.95rem;
    }

    .quiz-option:hover {
      background-color: #3a3a3a;
      border-color: #555;
    }

    .quiz-option.selected {
      border-color: var(--accent-orange);
      background-color: rgba(255, 107, 53, 0.1);
    }

    .quiz-navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
    }

    /* الأزرار */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent-orange), #D35400);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      transition: all 0.3s;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
      gap: 10px;
      border: 1px solid var(--gold);
      padding: 10px;
    }

    .btn:hover {
      background: linear-gradient(135deg, var(--accent-light-orange), #E55A2B);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 107, 53, 0.5);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn i {
      font-size: 1.1rem;
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--accent-orange);
      color: var(--accent-orange);
    }

    .btn-outline:hover {
      background-color: var(--accent-orange);
      color: white;
    }

    /* الرسائل */
    .message {
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .message.success {
      background-color: rgba(76, 175, 80, 0.2);
      border: 1px solid #4CAF50;
      color: #a5d6a7;
    }

    .message.error {
      background-color: rgba(255, 107, 53, 0.2);
      border: 1px solid var(--accent-orange);
      color: #ffabab;
    }

    .message.info {
      background-color: rgba(33, 150, 243, 0.2);
      border: 1px solid #2196F3;
      color: #90caf9;
    }

    /* التحميل */
    .loading {
      text-align: center;
      padding: 40px 20px;
      font-size: 1.1rem;
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
    }

    .loading i {
      font-size: 1.5rem;
      animation: spin 1.5s linear infinite;
    }

    
    /* تذييل الصفحة */
    footer {
      background-color: var(--secondary-black);
      color: var(--text-light);
      text-align: center;
      padding: 20px 15px;
      margin-top: 30px;
      border-top: 1px solid var(--border-dark);
      font-size: 0.9rem;
    }

    .footer-logo {
      color: var(--accent-orange);
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .footer-logo span {
      color: var(--gold);
    }

    /* القائمة الجانبية للموبايل */
    .mobile-menu-btn {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 100;
      background-color: var(--accent-orange);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      font-size: 1.5rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    @media (max-width: 991px) {
      .mobile-menu-btn {
        display: flex;
      }
    }

    /* تخصيص شريط التمرير */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent-orange);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-light-orange);
    }

    /* طبقة التعتيم للهاتف */
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 999;
    }

    .overlay.active {
      display: block;
    }

    /* تقدم المحاضرات */
    .progress-container {
      margin: 20px 0;
    }

    .progress-bar {
      height: 10px;
      background-color: #2a2a2a;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-orange), var(--accent-light-orange));
      border-radius: 5px;
      width: 0%;
      transition: width 0.5s ease;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-light);
    }

    /* القائمة الجانبية للجوال */
    .sidebar {
      transition: transform 0.3s ease;
    }

    @media (max-width: 991px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: -280px;
        width: 280px;
        height: 100%;
        z-index: 1000;
        margin: 0;
        border-radius: 0;
        overflow-y: auto;
        transition: left 0.3s ease;
      }
      
      .sidebar.active {
        left: 0;
      }
      
      .close-sidebar-btn {
        display: block;
        text-align: left;
        padding: 15px;
        cursor: pointer;
        color: var(--accent-orange);
        font-size: 1.2rem;
      }
    }

    .close-sidebar-btn {
      display: none;
    }

    @media (max-width: 450px){
      .container{
        padding: 0px;
      }
      .lecture-title{
        font-size: 14px;
      }
      .video-tab{
        font-size: 12px;
        padding: 6px 12px;
      }
      .main-content{
        padding: 15px;
      }
      .course-title{
        font-size: 18px;
      }
      .course-description{
        font-size: 12px;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="teacher-badge">
    <i class="fas fa-chalkboard-teacher"></i>
    <span>مستر عبدالله السيد</span>
  </div>

  <div class="page-header">
    <h1>منصة <span>مستر عبدالله السيد</span></h1>
    <p>تعليم ممتع وسهل - فيزياء وتكنولوجيا</p>
    <p class="teacher-title">خبير المنهج الدراسي</p>
  </div>

  <div class="container">
    <div id="courseBox" class="loading">
      <i class="fas fa-spinner fa-pulse"></i>
      <p>جارٍ تحميل بيانات الكورس...</p>
    </div>
    
    <div id="contentBox" style="display: none;"></div>
    <div id="lectureBox" style="display: none;"></div>
  </div>

  <footer>
    <div class="footer-logo">مستر عبدالله السيد</div>
    <p>جميع الحقوق محفوظة © 2025</p>
  </footer>

  <button class="mobile-menu-btn" id="mobileMenuBtn">
    <i class="fas fa-bars"></i>
  </button>
  <div class="overlay" id="overlay"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { 
      getFirestore, doc, getDoc, collection, query, where, getDocs, updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCC5aNDvRjMZFle2tFp3vY6kb74kjVp7Dg",
      authDomain: "subscriptions-f84ee.firebaseapp.com",
      projectId: "subscriptions-f84ee",
      storageBucket: "subscriptions-f84ee.firebasestorage.app",
      messagingSenderId: "425125909485",
      appId: "1:425125909485:web:1dcdf4989d35e5e53c8de4",
      measurementId: "G-B6X1XTLM6Q"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get("id");

    let courseData = null;
    let currentLectureIndex = 0;
    let currentQuizIndex = 0;
    let quizAnswers = [];
    let studentProgress = {};
    let currentVideoIndex = 0;

    // دالة لاستخراج ID الفيديو من رابط اليوتيوب
    function getYouTubeEmbedUrl(youtubeUrl) {
      if (!youtubeUrl) return '';
      
      let videoId = '';
      
      if (youtubeUrl.includes('youtu.be/')) {
        videoId = youtubeUrl.split('youtu.be/')[1]?.split('?')[0];
      } else if (youtubeUrl.includes('youtube.com/watch?v=')) {
        videoId = youtubeUrl.split('v=')[1]?.split('&')[0];
      } else if (youtubeUrl.includes('youtube.com/embed/')) {
        videoId = youtubeUrl.split('embed/')[1]?.split('?')[0];
      } else if (youtubeUrl.includes('youtube.com/v/')) {
        videoId = youtubeUrl.split('v/')[1]?.split('?')[0];
      }
      
      if (videoId && videoId.length === 11) {
        return `https://www.youtube.com/embed/${videoId}`;
      }
      
      return youtubeUrl;
    }

    async function loadCourse() {
      const courseRef = doc(db, "courses", courseId);
      const snap = await getDoc(courseRef);

      if (!snap.exists()) {
        document.getElementById("courseBox").innerHTML = `
          <div class="message error">
            <i class="fas fa-exclamation-circle"></i>
            <h3>الكورس غير موجود</h3>
            <p>عذراً، لا يمكن العثور على الكورس المطلوب</p>
            <button class="btn" onclick="window.history.back()" style="margin-top: 15px; width: auto; padding: 10px 20px;">
              <i class="fas fa-arrow-right"></i> العودة
            </button>
          </div>
        `;
        return;
      }

      courseData = snap.data();

      // كورس مجاني
      if (courseData.price === 0) {
        const progressKey = `course_${courseId}_progress`;
        if (!localStorage.getItem(progressKey)) {
          studentProgress = { completedLectures: [], quizResults: {} };
          localStorage.setItem(progressKey, JSON.stringify(studentProgress));
        } else {
          studentProgress = JSON.parse(localStorage.getItem(progressKey));
        }
        showCourseContent();
        return;
      }

      // تحميل تقدم الطالب
      const progressKey = `course_${courseId}_progress`;
      const savedProgress = localStorage.getItem(progressKey);
      if (savedProgress) {
        studentProgress = JSON.parse(savedProgress);
      } else {
        studentProgress = { completedLectures: [], quizResults: {} };
        localStorage.setItem(progressKey, JSON.stringify(studentProgress));
      }

      const studentData = JSON.parse(localStorage.getItem("studentData"));

      if (!studentData) {
        renderCodeInput();
        return;
      }

      const q = query(
        collection(db, "codes"),
        where("courseId", "==", courseId),
        where("isUsed", "==", true)
      );

      const snapCodes = await getDocs(q);
      const codeUsedByStudent = snapCodes.docs.find(doc => {
        const d = doc.data();
        return d.usedBy && d.usedBy.studentId === studentData.studentId;
      });

      if (codeUsedByStudent) {
        showCourseContent();
      } else {
        renderCodeInput();
      }
    }

    window.checkCode = async function () {
      const code = document.getElementById("codeInput").value.trim();
      const msg = document.getElementById("msg");
      const studentData = JSON.parse(localStorage.getItem("studentData"));
      
      if (!studentData) { 
        msg.innerHTML = `<div class="message error">لم يتم تسجيل بيانات الطالب. يرجى تسجيل الدخول أولاً.</div>`;
        return; 
      }

      msg.innerHTML = `<div class="message info"><i class="fas fa-spinner fa-pulse"></i> جاري التحقق من الكود...</div>`;

      const q = query(
        collection(db, "codes"),
        where("courseId", "==", courseId),
        where("code", "==", code)
      );

      const snap = await getDocs(q);
      if (snap.empty) { 
        msg.innerHTML = `<div class="message error">الكود غير صحيح. يرجى التأكد وإعادة المحاولة.</div>`;
        return; 
      }

      const docRef = snap.docs[0].ref;
      const data = snap.docs[0].data();

      if (data.isUsed && data.usedBy && data.usedBy.studentId === studentData.studentId) {
        msg.innerHTML = `<div class="message error">لقد قمت بتفعيل هذا الكورس مسبقاً.</div>`;
        return;
      }

      if (data.isUsed && (!data.usedBy || data.usedBy.studentId !== studentData.studentId)) {
        msg.innerHTML = `<div class="message error">هذا الكود مستخدم من قبل طالب آخر.</div>`;
        return;
      }

      await updateDoc(docRef, {
        isUsed: true,
        usedBy: {
          name: studentData.name,
          parentPhone: studentData.parentPhone,
          school: studentData.school,
          studentId: studentData.studentId,
          id: snap.docs[0].id
        },
        usedAt: new Date().toISOString()
      });

      msg.innerHTML = `<div class="message success">تم تفعيل الكورس بنجاح! جاري تحميل المحتوى...</div>`;

      setTimeout(() => {
        showCourseContent();
      }, 1500);
    };

        showLecture(lectureIndex);
      }

    function updateQuizDisplay() {
      const lecture = courseData.lectures[currentLectureIndex];
      const quiz = lecture.quiz;
      const currentQuestion = quiz[currentQuizIndex];
      
      if (!currentQuestion) return;
      
      document.getElementById("currentQuestion").textContent = currentQuizIndex + 1;
      document.getElementById("totalQuestions").textContent = quiz.length;
      document.getElementById("totalQuestions2").textContent = quiz.length;
      
      const answeredCount = quizAnswers.filter(answer => answer !== null).length;
      document.getElementById("answeredCount").textContent = answeredCount;
      
      document.getElementById("prevQuestion").disabled = currentQuizIndex === 0;
      document.getElementById("nextQuestion").style.display = currentQuizIndex < quiz.length - 1 ? "inline-flex" : "none";
      document.getElementById("submitQuiz").style.display = answeredCount === quiz.length ? "inline-flex" : "none";
      
      const quizContent = document.getElementById("quizContent");
      quizContent.innerHTML = `
        <div class="quiz-question">
          ${currentQuestion.questionImage ? `
            <img src="${currentQuestion.questionImage}" class="quiz-question-image" alt="صورة السؤال">
          ` : ""}

            ${currentQuestion.options.map((option, index) => `

                ${option.text}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    window.changeQuizQuestion = function(direction) {
      const lecture = courseData.lectures[currentLectureIndex];
      const quiz = lecture.quiz;
      
      currentQuizIndex += direction;
      if (currentQuizIndex < 0) currentQuizIndex = 0;
      if (currentQuizIndex >= quiz.length) currentQuizIndex = quiz.length - 1;
      
      updateQuizDisplay();
    }

    window.selectQuizAnswer = function(answerIndex) {
      quizAnswers[currentQuizIndex] = answerIndex;
      updateQuizDisplay();
    }

    window.submitQuiz = function(lectureIndex) {
      const lecture = courseData.lectures[lectureIndex];
      const quiz = lecture.quiz;
      
      let correctCount = 0;
      for (let i = 0; i < quiz.length; i++) {
        if (quizAnswers[i] === quiz[i].correct) {
          correctCount++;
        }
      }
      
      if (correctCount === quiz.length) {
        if (!studentProgress.quizResults) studentProgress.quizResults = {};
        studentProgress.quizResults[lectureIndex] = true;
        const progressKey = `course_${courseId}_progress`;
        localStorage.setItem(progressKey, JSON.stringify(studentProgress));
        
        alert(`🎉 مبروك! أجبت على جميع الأسئلة بشكل صحيح!\nسيتم فتح المحاضرة الآن.`);
        showLecture(lectureIndex);
      } else {
        alert(`❌ نتيجتك: ${correctCount} من ${quiz.length}\nيجب الإجابة على جميع الأسئلة بشكل صحيح لفتح المحاضرة.\nحاول مرة أخرى!`);
      }
    }

      document.getElementById("lectureBox").style.display = "none";
      document.getElementById("contentBox").style.display = "block";
    }

    // عرض المحاضرة مع الفيديوهات المتعددة
    function showLecture(lectureIndex) {
      const lecture = courseData.lectures[lectureIndex];
      currentVideoIndex = 0;
      
      if (!studentProgress.completedLectures || !studentProgress.completedLectures.includes(lectureIndex)) {
        studentProgress.completedLectures.push(lectureIndex);
        const progressKey = `course_${courseId}_progress`;
        localStorage.setItem(progressKey, JSON.stringify(studentProgress));
      }
      
      document.getElementById("lectureBox").style.display = "block";
      document.getElementById("contentBox").style.display = "none";
      
      // إنشاء علامات تبويب الفيديوهات
      let videosTabsHTML = "";
      let videosFramesHTML = "";
      
      if (lecture.videos && lecture.videos.length > 0) {
        lecture.videos.forEach((video, idx) => {
          const videoUrl = getYouTubeEmbedUrl(video.url);
          videosTabsHTML += `
            <div class="video-tab ${idx === 0 ? 'active' : ''}" onclick="switchToVideo(${idx})">
              <i class="fas fa-play-circle"></i> ${video.title || `فيديو ${idx + 1}`}
            </div>
          `;
          videosFramesHTML += `
            <iframe 
              id="videoFrame_${idx}"
              class="video-frame"
              src="${videoUrl}" 
              frameborder="0" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen
              title="${video.title || `فيديو ${idx + 1}`}"
              style="display: ${idx === 0 ? 'block' : 'none'};"
            >
            </iframe>
          `;
        });
      } else if (lecture.videoLink) {
        // للتوافق مع الإصدارات القديمة
        const videoUrl = getYouTubeEmbedUrl(lecture.videoLink);
        videosTabsHTML = `
          <div class="video-tab active">
            <i class="fas fa-play-circle"></i> فيديو الشرح
          </div>
        `;
        videosFramesHTML = `
          <iframe 
            id="videoFrame_0"
            class="video-frame"
            src="${videoUrl}" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen
            title="فيديو الشرح"
            style="display: block;"
          >
          </iframe>
        `;
      }
      
      document.getElementById("lectureBox").innerHTML = `
        <div class="course-container">
          <div class="main-content">
            <div class="lecture-page active">
              <div class="lecture-header">
                <div>
                  <h2 class="lecture-title" style="color: var(--accent-light-orange); margin-bottom: 5px;">
                    <i class="fas fa-chalkboard-teacher"></i> المحاضرة ${lectureIndex + 1}: ${lecture.title}
                  </h2>
                </div>
                <button class="back-to-list" onclick="backToLecturesList()">
                  <i class="fas fa-arrow-right"></i> العودة للقائمة
                </button>
              </div>
              
              <!-- علامات تبويب الفيديوهات -->
              <div class="video-tabs" id="videoTabs">
                ${videosTabsHTML}
                ${lecture.homeworkVideo ? `
                  <div class="video-tab" onclick="switchToHomeworkVideo()">
                    <i class="fas fa-tasks"></i> فيديو الواجب
                  </div>
                ` : ''}
                ${lecture.pdfLink ? `
                  <a href="${lecture.pdfLink}" target="_blank" class="resource-link">
                    <i class="fas fa-file-pdf"></i> ملف PDF
                  </a>
                ` : ''}
              </div>
              
              <!-- حاوية الفيديو -->
              <div class="video-container" id="videoContainer">
                ${videosFramesHTML}
                ${lecture.homeworkVideo ? `
                  <iframe 
                    id="homeworkVideoFrame"
                    class="video-frame"
                    src="${getYouTubeEmbedUrl(lecture.homeworkVideo)}" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen
                    title="فيديو الواجب"
                    style="display: none;"
                  >
                  </iframe>
                ` : ''}
              </div>
              
              <div class="lecture-resources">
                ${lecture.images && lecture.images.length > 0 ? `
                  <a href="#" class="resource-link" onclick="showLectureImages(${lectureIndex}); return false;">
                    <i class="fas fa-images"></i> صور المحاضرة (${lecture.images.length})
                  </a>
                ` : ''}
              </div>
            </div>
          </div>
          
          <div class="sidebar">
            <div class="close-sidebar-btn" id="closeSidebarBtn">
              <i class="fas fa-times"></i> إغلاق
            </div>
            
            <h3 style="color: var(--accent-light-orange); font-size: 1.3rem; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--accent-orange);">
              <i class="fas fa-lightbulb"></i> نصائح مهمة
            </h3>
            
            <div style="background-color: #2a2a2a; padding: 15px; border-radius: 10px;">
              <p style="margin-bottom: 10px; display: flex; align-items: flex-start; gap: 10px;">
                <i class="fas fa-star" style="color: var(--accent-orange); margin-top: 3px;"></i>
                <span>شاهد جميع فيديوهات الشرح بتركيز</span>
              </p>
              ${lecture.homeworkVideo ? `
                <p style="margin-bottom: 10px; display: flex; align-items: flex-start; gap: 10px;">
                  <i class="fas fa-star" style="color: var(--accent-orange); margin-top: 3px;"></i>
                  <span>ثم شاهد فيديو الواجب لحل التمارين</span>
                </p>
              ` : ''}
              ${lecture.pdfLink ? `
                <p style="margin-bottom: 10px; display: flex; align-items: flex-start; gap: 10px;">
                  <i class="fas fa-star" style="color: var(--accent-orange); margin-top: 3px;"></i>
                  <span>حمل ملف PDF للمراجعة السريعة</span>
                </p>
              ` : ''}
              <p style="display: flex; align-items: flex-start; gap: 10px;">
                <i class="fas fa-star" style="color: var(--accent-orange); margin-top: 3px;"></i>
                <span>اكتب الملاحظات أثناء المشاهدة</span>
              </p>
            </div>
          </div>
        </div>
      `;
      
      setupMobileMenu();
      
      const closeSidebarBtn = document.getElementById('closeSidebarBtn');
      if (closeSidebarBtn) {
        closeSidebarBtn.onclick = () => {
          document.querySelector('.sidebar')?.classList.remove('active');
          document.getElementById('overlay')?.classList.remove('active');
        };
      }
    }

    // التبديل بين الفيديوهات
    window.switchToVideo = function(videoIndex) {
      const lecture = courseData.lectures[currentLectureIndex];
      if (!lecture.videos || videoIndex >= lecture.videos.length) return;
      
      // إخفاء جميع إطارات الفيديو
      for (let i = 0; i < lecture.videos.length; i++) {
        const frame = document.getElementById(`videoFrame_${i}`);
        if (frame) frame.style.display = 'none';
      }
      
      // إخفاء فيديو الواجب إذا كان موجود
      const homeworkFrame = document.getElementById('homeworkVideoFrame');
      if (homeworkFrame) homeworkFrame.style.display = 'none';
      
      // عرض الفيديو المحدد
      const selectedFrame = document.getElementById(`videoFrame_${videoIndex}`);
      if (selectedFrame) selectedFrame.style.display = 'block';
      
      // تحديث علامات التبويب
      const tabs = document.querySelectorAll('.video-tab');
      tabs.forEach((tab, idx) => {
        if (idx === videoIndex) {
          tab.classList.add('active');
        } else if (!tab.textContent.includes('الواجب')) {
          tab.classList.remove('active');
        }
      });
      
      currentVideoIndex = videoIndex;
    }

    window.switchToHomeworkVideo = function() {
      // إخفاء جميع فيديوهات الشرح
      const lecture = courseData.lectures[currentLectureIndex];
      if (lecture.videos) {
        for (let i = 0; i < lecture.videos.length; i++) {
          const frame = document.getElementById(`videoFrame_${i}`);
          if (frame) frame.style.display = 'none';
        }
      }
      
      // عرض فيديو الواجب
      const homeworkFrame = document.getElementById('homeworkVideoFrame');
      if (homeworkFrame) homeworkFrame.style.display = 'block';
      
      // تحديث علامات التبويب
      const tabs = document.querySelectorAll('.video-tab');
      tabs.forEach(tab => {
        if (tab.textContent.includes('الواجب')) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });
    }

    window.showLectureImages = function(lectureIndex) {
      const lecture = courseData.lectures[lectureIndex];
      if (!lecture.images || lecture.images.length === 0) return;
      
      const imagesHTML = lecture.images.map(img => `
        <div style="margin-bottom: 15px;">
          <img src="${img}" style="width: 100%; border-radius: 8px; border: 2px solid var(--border-dark);">
        </div>
      `).join('');
      
      const modal = document.createElement('div');
      modal.id = 'imagesModal';
      modal.style.cssText = 'position: fixed; top: 0; right: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;';
      modal.innerHTML = `
        <div style="background-color: var(--secondary-black); border-radius: 15px; padding: 20px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="color: var(--accent-light-orange);">
              <i class="fas fa-images"></i> صور المحاضرة ${lectureIndex + 1}
            </h3>
            <button onclick="this.closest('#imagesModal').remove()" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <div>${imagesHTML}</div>
          <div style="text-align: center; margin-top: 20px;">
            <button class="btn" onclick="this.closest('#imagesModal').remove()">
              <i class="fas fa-times"></i> إغلاق
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    window.backToLecturesList = function() {
      document.getElementById("lectureBox").style.display = "none";
      document.getElementById("contentBox").style.display = "block";
      showCourseContent();
    }

    loadCourse();
  </script>
  <script>
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("keydown", function(e) {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || 
          (e.ctrlKey && e.shiftKey && e.key === "J") || (e.ctrlKey && e.key === "U")) {
        e.preventDefault();
      }
    });
  </script> 
</body>
</html>
