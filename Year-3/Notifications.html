<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إشعارات تانية ثانوي</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: "Tajawal", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4efe9 100%);
      padding: 20px;
      min-height: 100vh;
      color: #333;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }
    
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #2c7744;
    }
    
    .notif-container {
      position: relative;
      display: inline-block;
    }
    
    .notif-btn {
      position: relative;
      background: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    
    .notif-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }
    
    .notif-btn.pulse {
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(44, 119, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(44, 119, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(44, 119, 68, 0); }
    }
    
    .notif-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #e74c3c;
      color: white;
      font-size: 11px;
      font-weight: bold;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      text-align: center;
      line-height: 20px;
      display: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    .notif-box {
      display: none;
      position: absolute;
      top: 60px;
      right: 0px;
      background: white;
      border-radius: 12px;
      width: 350px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: 0;
      z-index: 100;
      overflow: hidden;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .notif-header {
      padding: 15px 20px;
      background: #2c7744;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .notif-title {
      font-weight: bold;
      font-size: 18px;
    }
    
    .notif-count {
      background: rgba(255,255,255,0.2);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 14px;
    }
    
    .notif-body {
      max-height: 400px;
      overflow-y: auto;
    }
    
    .notif-msg {
      padding: 15px 20px;
      border-bottom: 1px solid #f0f0f0;
      transition: all 0.3s ease;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      opacity: 0;
      transform: translateX(-20px);
      animation: slideIn 0.4s ease forwards;
    }
    
    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    .notif-msg:hover {
      background: #f9f9f9;
      transform: translateX(5px);
    }
    
    .notif-msg.new {
      background: #f8f9fa;
      border-right: 3px solid #2c7744;
    }
    
    .notif-icon {
      margin-left: 12px;
      color: #2c7744;
      font-size: 18px;
      margin-top: 2px;
    }
    
    .notif-content {
      flex: 1;
    }
    
    .notif-text {
      margin-bottom: 5px;
      line-height: 1.4;
    }
    
    .notif-time {
      font-size: 12px;
      color: #7f8c8d;
    }
    
    .notif-link {
      color: #2c7744;
      text-decoration: none;
      display: block;
      margin-top: 5px;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .notif-link:hover {
      text-decoration: underline;
      transform: translateX(3px);
    }
    
    .notif-empty {
      padding: 30px 20px;
      text-align: center;
      color: #95a5a6;
    }
    
    .notif-footer {
      padding: 12px 20px;
      text-align: center;
      border-top: 1px solid #f0f0f0;
    }
    
    .mark-read {
      background: none;
      border: none;
      color: #2c7744;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      padding: 8px 15px;
      border-radius: 20px;
      transition: all 0.3s;
    }
    
    .mark-read:hover {
      background: #f0f7f4;
      transform: translateY(-2px);
    }
    
    /* تخصيص شريط التمرير */
    .notif-body::-webkit-scrollbar {
      width: 6px;
    }
    
    .notif-body::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    
    .notif-body::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 3px;
    }
    
    .notif-body::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }
    
    /* تأثير اهتزاز الجرس */
    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-15deg); }
      75% { transform: rotate(15deg); }
    }
    
    .notif-btn.shake {
      animation: shake 0.5s ease;
    }

    .content {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      margin-top: 30px;
    }
    
    h1 {
      color: #2c7744;
      margin-bottom: 20px;
      text-align: center;
    }
    
    p {
      line-height: 1.6;
      margin-bottom: 15px;
      color: #555;
    }
  </style>
</head>
<body>
    <header>
      <div class="notif-container">
        <button class="notif-btn" id="notifBtn">
          🔔
          <div class="notif-dot" id="notifDot">0</div>
        </button>
        <div class="notif-box" id="notifBox">
          <div class="notif-header">
            <div class="notif-title">الإشعارات</div>
            <div class="notif-count" id="notifCount">0 جديد</div>
          </div>
          <div class="notif-body" id="notifBody">
            <!-- سيتم ملء الإشعارات هنا ديناميكياً -->
          </div>
          <div class="notif-footer">
            <button class="mark-read" id="markReadBtn">تحديد الكل كمقروء</button>
          </div>
        </div>
      </div>
    </header>
    

  <!-- عنصر صوتي للإشعارات -->
  <audio id="notificationSound" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3" type="audio/mpeg">
  </audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBaezH8j4u0Kmum3poYuFk8LsGtVietnSM",
      authDomain: "viduo-corss.firebasestorage.app",
      projectId: "viduo-corss", 
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const userGrade = "2"; // 👈 إشعارات تانية ثانوي

    // عناصر DOM
    const notifBtn = document.getElementById('notifBtn');
    const notifBox = document.getElementById('notifBox');
    const notifDot = document.getElementById('notifDot');
    const notifBody = document.getElementById('notifBody');
    const notifCount = document.getElementById('notifCount');
    const markReadBtn = document.getElementById('markReadBtn');
    const notificationSound = document.getElementById('notificationSound');

    // متغيرات الحالة
    let notifications = [];
    let isBoxOpen = false;

    // تحميل حالة القراءة من localStorage
    function loadReadNotifications() {
      const read = localStorage.getItem('readNotifications');
      return read ? new Set(JSON.parse(read)) : new Set();
    }

    // حفظ حالة القراءة في localStorage
    function saveReadNotifications(readNotifications) {
      localStorage.setItem('readNotifications', JSON.stringify([...readNotifications]));
    }

    // تهيئة حالة القراءة
    let readNotifications = loadReadNotifications();

    // حساب عدد الإشعارات غير المقروءة
    function getUnreadCount() {
      return notifications.filter(notif => !readNotifications.has(notif.id)).length;
    }

    // استعلام Firebase
    const q = query(collection(db, "notifications"), orderBy("createdAt", "desc"));

    // الاستماع للتحديثات في الوقت الحقيقي
    onSnapshot(q, (snapshot) => {
      const newNotifications = [];
      let hasNewNotifications = false;
      
      snapshot.forEach(doc => {
        const data = doc.data();
        if (data.grade === userGrade) {
          const notification = {
            id: doc.id,
            ...data
          };
          newNotifications.push(notification);
          
          // التحقق مما إذا كانت هذه إشعاراً جديداً ولم يتم قراءته
          if (!readNotifications.has(doc.id)) {
            hasNewNotifications = true;
          }
        }
      });
      
      // تحديث حالة الإشعارات
      notifications = newNotifications;
      
      // تحديث العداد إذا كانت هناك إشعارات جديدة غير مقروءة
      const unreadCount = getUnreadCount();
      updateNotificationUI(unreadCount);
      
      if (hasNewNotifications && !isBoxOpen && unreadCount > 0) {
        playNotificationSound();
        showNotificationEffects();
      }
      
      renderNotifications();
    });

    // عرض الإشعارات في الجرس
    function renderNotifications() {
      notifBody.innerHTML = '';
      
      if (notifications.length === 0) {
        notifBody.innerHTML = '<div class="notif-empty">لا توجد إشعارات</div>';
        return;
      }
      
      notifications.forEach((notification, index) => {
        const notifElement = document.createElement('div');
        notifElement.className = 'notif-msg';
        
        // تحديد إذا كانت الإشعار غير مقروء
        const isUnread = !readNotifications.has(notification.id);
        if (isUnread) {
          notifElement.classList.add('new');
        }
        
        // تأخير ظهور الرسائل تدريجياً
        notifElement.style.animationDelay = `${index * 0.1}s`;
        
        const timeText = notification.createdAt ? 
          formatTime(notification.createdAt.toDate()) : 'الآن';
        
        notifElement.innerHTML = `
          <div class="notif-icon">${isUnread ? '🔔' : '📭'}</div>
          <div class="notif-content">
            <div class="notif-text">${notification.message || 'إشعار جديد'}</div>
            ${notification.link ? `<a href="${notification.link}" target="_blank" class="notif-link">📎 فتح الرابط</a>` : ""}
            <div class="notif-time">${timeText}</div>
          </div>
        `;
        
        notifBody.appendChild(notifElement);
      });
    }

    // تحديث واجهة الإشعارات
    function updateNotificationUI(unreadCount) {
      notifDot.textContent = unreadCount > 9 ? '9+' : unreadCount;
      notifDot.style.display = unreadCount > 0 ? 'block' : 'none';
      notifCount.textContent = `${unreadCount} جديد`;
      
      // إضافة أو إزالة تأثير النبض
      if (unreadCount > 0) {
        notifBtn.classList.add('pulse');
      } else {
        notifBtn.classList.remove('pulse');
      }
    }

    // تشغيل صوت الإشعار
    function playNotificationSound() {
      try {
        notificationSound.currentTime = 0;
        notificationSound.play();
      } catch (error) {
        console.log("تعذر تشغيل صوت الإشعار:", error);
      }
    }

    // عرض تأثيرات الإشعار الجديد
    function showNotificationEffects() {
      // اهتزاز الجرس
      notifBtn.classList.add('shake');
      setTimeout(() => {
        notifBtn.classList.remove('shake');
      }, 500);
    }

    // تنسيق الوقت
    function formatTime(date) {
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);
      
      if (diffMins < 1) return 'الآن';
      if (diffMins < 60) return `منذ ${diffMins} دقيقة`;
      if (diffHours < 24) return `منذ ${diffHours} ساعة`;
      if (diffDays < 7) return `منذ ${diffDays} يوم`;
      
      return date.toLocaleDateString('ar-EG');
    }

    // أحداث النقر
    notifBtn.addEventListener('click', () => {
      isBoxOpen = !isBoxOpen;
      notifBox.style.display = isBoxOpen ? 'block' : 'none';
    });

    markReadBtn.addEventListener('click', () => {
      // إضافة جميع الإشعارات الحالية إلى قائمة المقروء
      notifications.forEach(notif => {
        readNotifications.add(notif.id);
      });
      
      // حفظ حالة القراءة
      saveReadNotifications(readNotifications);
      
      // تحديث الواجهة
      const unreadCount = getUnreadCount();
      updateNotificationUI(unreadCount);
      renderNotifications();
    });

    // إغلاق صندوق الإشعارات عند النقر خارجها
    document.addEventListener('click', (e) => {
      const notifContainer = document.querySelector('.notif-container');
      if (!notifContainer.contains(e.target) && isBoxOpen) {
        notifBox.style.display = 'none';
        isBoxOpen = false;
      }
    });

    // تحديث الواجهة عند التحميل الأولي
    const initialUnreadCount = getUnreadCount();
    updateNotificationUI(initialUnreadCount);
  </script>
 
</body>
</html>
