        .header{
      display: flex;
      position: sticky;
      top: 0;
      z-index: 10000;
      justify-content: center;
      align-items: center;
      gap: 20px;
      backdrop-filter: blur(5px);

.header a{

  color: #000;
  transition: .3s ease;
}


.header a img {
  width: 24px;
  height: 24px;
  object-fit: cover;
}
.header a {
  display: flex;
  align-items: center;

  padding: 10px;

.header a i {

  transition: 0.3s;
}

/* هَوَّر */
.header a:hover {

}

/* يخلي الأيقونة نفس اللون الأبيض */
.header a:hover i {

}
