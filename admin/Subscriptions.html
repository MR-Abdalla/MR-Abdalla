<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأكواد حسب الكورس</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #FF6B35;
      --primary-dark: #E55A2B;
      --primary-light: #FF8E53;
      --secondary: #4ECDC4;
      --light: #F7F9FC;
      --dark: #292F36;
      --gray: #6C757D;
      --light-gray: #E9ECEF;
      --card-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      --card-shadow-hover: 0 10px 25px rgba(0, 0, 0, 0.15);
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', Arial, sans-serif;
      background: linear-gradient(135deg, #fdf6e3 0%, #f5f5f5 100%);
      color: var(--dark);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* الشريط الجانبي */
    .sidebar {
      width: 280px;
      background: white;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
      padding: 25px 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
      top: 0;
      right: 0;
      transform: translateX(0);
      transition: transform 0.3s ease;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 25px 25px;
      border-bottom: 1px solid var(--light-gray);
      margin-bottom: 25px;
    }

    .logo i {
      font-size: 2.2rem;
      color: var(--primary);
      background: rgba(255, 107, 53, 0.1);
      padding: 12px;
      border-radius: 12px;
    }

    .logo-text {
      font-size: 1rem;
      font-weight: 800;
    }

    .student-info {
      background: rgba(255, 107, 53, 0.05);
      border-radius: 12px;
      padding: 15px;
      margin: 0 15px 20px;
      border: 1px solid rgba(255, 107, 53, 0.1);
    }

    .student-name {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--dark);
    }

    .student-details {
      font-size: 0.85rem;
      color: var(--gray);
      line-height: 1.5;
    }

    .nav-menu {
      list-style: none;
      padding: 0 20px;
    }

    .nav-item {
      margin-bottom: 8px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 9px 18px;
      color: var(--dark);
      text-decoration: none;
      border-radius: 12px;
      transition: var(--transition);
      position: relative;
    }

    .nav-link:hover, .nav-link.active {
      background-color: rgba(255, 107, 53, 0.1);
      color: var(--primary);
    }

    .nav-link.active {
      font-weight: 700;
    }

    .nav-link.active::before {
      content: '';
      position: absolute;
      right: -20px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 60%;
      background: var(--primary);
      border-radius: 2px;
    }

    .nav-link i {
      font-size: 1.3rem;
      width: 24px;
      text-align: center;
    }

    /* المحتوى الرئيسي */
    .main-content {
      flex: 1;
      margin-right: 280px;
      padding: 30px;
      transition: var(--transition);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--light-gray);
    }

    .page-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-title i {
      color: var(--primary);
      background: rgba(255, 107, 53, 0.1);
      padding: 10px;
      border-radius: 10px;
    }

    .search-container {
      flex: 1;
      max-width: 500px;
      position: relative;
      margin: 0 30px;
    }

    .search-input {
      width: 100%;
      padding: 14px 20px 14px 50px;
      border: 1px solid var(--light-gray);
      border-radius: 50px;
      font-size: 1rem;
      background: white;
      transition: var(--transition);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2);
    }

    .search-icon {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
    }

    .user-actions {
      display: flex;
      gap: 15px;
    }

    .user-btn {
      background: white;
      border: 1px solid var(--light-gray);
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: var(--transition);
      font-weight: 600;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .user-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 5px 10px rgba(255, 107, 53, 0.2);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
    }

    /* شبكة الكورسات */
    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }

    .course-box {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: var(--transition);
      border-top: 5px solid var(--primary);
    }

    .course-box:hover {
      transform: translateY(-5px);
      box-shadow: var(--card-shadow-hover);
    }

    .course-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 20px;
      position: relative;
    }

    .course-header h3 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .course-id {
      font-size: 0.9rem;
      opacity: 0.9;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 5px;
    }

    .codes-container {
      padding: 20px;
      max-height: 300px;
      overflow-y: auto;
    }

    .code-item {
      background: var(--light);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      border-right: 4px solid var(--primary);
      transition: var(--transition);
    }

    .code-item:hover {
      background: #f0f7ff;
      transform: translateX(-5px);
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .code-value {
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-dark);
      background: rgba(255, 107, 53, 0.1);
      padding: 5px 12px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-used {
      background: rgba(220, 53, 69, 0.1);
      color: #dc3545;
    }

    .status-available {
      background: rgba(40, 167, 69, 0.1);
      color: #28a745;
    }

    .code-details {
      color: var(--gray);
      font-size: 0.9rem;
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .code-details i {
      margin-left: 5px;
      color: var(--primary);
    }

    .course-footer {
      padding: 0 20px 20px;
      text-align: center;
    }

    .add-code-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .add-code-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 107, 53, 0.3);
    }

    /* زر القائمة للهواتف */
    .mobile-menu-btn {
      display: none;
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 1000;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 90;
    }

    .overlay.active {
      display: block;
    }

    /* حالة التحميل والفراغ */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
      background: white;
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      grid-column: 1 / -1;
    }

    .loading i {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: var(--primary);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* شريط التمرير */
    .codes-container::-webkit-scrollbar {
      width: 6px;
    }

    .codes-container::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 3px;
    }

    .codes-container::-webkit-scrollbar-thumb {
      background: var(--primary-light);
      border-radius: 3px;
    }

    .codes-container::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    /* الهيدر المتنقل */
    .mobile-header {
      display: none;
    }

    /* التكيف مع الشاشات الصغيرة */
    @media (max-width: 992px) {
      .sidebar {
        transform: translateX(100%);
        width: 280px;
      }
      
      .sidebar.active {
        transform: translateX(0);
      }
      
      .main-content {
        margin-right: 0;
        padding: 20px;
      }
      
      .mobile-menu-btn {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .header {
        flex-direction: column;
        gap: 20px;
        align-items: stretch;
        margin-top: 20px;
      }
      
      .search-container {
        margin: 0;
        max-width: 100%;
      }
    }

    @media (max-width: 768px) {
      .courses-grid {
        grid-template-columns: 1fr;
      }
      
      .code-details {
        flex-direction: column;
        gap: 5px;
      }
    }

    @media (max-width: 480px) {
      .mobile-header {
        display: flex;
        direction: rtl;
        background: rgba(255, 255, 255, 0.384);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 10px 15px;
        align-items: center;
        position: fixed;
        top: 0;
        right: 0;
        width: 100%;
        z-index: 80;
      }
      
      .mobile-header img {
        height: 40px;
        border-radius: 8px;
      }
      
      .user-actions {
        flex-wrap: wrap;
        justify-content: center;
      }
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      margin-top: 30px;
      font-size: 0.9rem;
      border-top: 1px solid #eee;
      background: white;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <!-- زر القائمة للهواتف -->
  <button class="mobile-menu-btn" id="menuBtn">
    <i class="fas fa-bars"></i>
  </button>

  <!-- الشريط الجانبي -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <i class="fas fa-key"></i>
      <div class="logo-text">
        <div>إدارة الأكواد</div>
        <div style="font-size: 0.8rem; color: var(--gray);">النظام الإداري</div>
      </div>
    </div>

    <div class="student-info">
      <div class="student-name">المسؤول الإداري</div>
      <div class="student-details">
        <div>مشرف النظام</div>
        <div>الصلاحية: كاملة</div>
      </div>
    </div>

    <ul class="nav-menu">
      <li class="nav-item">
        <a href="index.html" class="nav-link">
          <i class="fas fa-home"></i>
          <span>الرئيسية</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link active">
          <i class="fas fa-code"></i>
          <span>الأكواد</span>
          <span style="margin-right: auto; background: var(--primary); color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem;" id="codesCount">0</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link">
          <i class="fas fa-book"></i>
          <span>الكورسات</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link">
          <i class="fas fa-users"></i>
          <span>المستخدمين</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link">
          <i class="fas fa-chart-bar"></i>
          <span>الإحصائيات</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link">
          <i class="fas fa-cog"></i>
          <span>الإعدادات</span>
        </a>
      </li>
    </ul>
  </aside>

  <!-- الـ overlay للهواتف -->
  <div class="overlay" id="overlay"></div>

  <!-- المحتوى الرئيسي -->
  <main class="main-content">
    <!-- الهيدر المتنقل -->
    <div class="mobile-header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <i class="fas fa-key" style="color: var(--primary); font-size: 1.5rem;"></i>
        <span style="font-weight: 700; font-size: 1.2rem;">الأكواد</span>
      </div>
    </div>

    <!-- الهيدر الرئيسي -->
    <div class="header">
      <div class="page-title">
        <i class="fas fa-code-branch"></i>
        الأكواد حسب الكورس
      </div>
      
      <div class="search-container">
        <input type="text" class="search-input" placeholder="ابحث عن كود أو كورس...">
        <i class="fas fa-search search-icon"></i>
      </div>
      
      <div class="user-actions">
        <button class="user-btn" onclick="refreshData()">
          <i class="fas fa-sync-alt"></i>
          <span>تحديث</span>
        </button>
        <div class="user-profile">
          <div class="avatar">م</div>
        </div>
      </div>
    </div>

    <!-- شبكة الكورسات والأكواد -->
    <div class="courses-grid" id="coursesContainer">
      <div class="loading">
        <i class="fas fa-spinner"></i>
        <h3>جاري تحميل الأكواد...</h3>
      </div>
    </div>

    <footer>
      <p>نظام إدارة أكواد الكورسات &copy; 2023 | إجمالي الأكواد: <span id="totalCodes">0</span></p>
    </footer>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { 
      getFirestore,
      collection,
      getDocs,
      addDoc
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCC5aNDvRjMZFle2tFp3vY6kb74kjVp7Dg",
      authDomain: "subscriptions-f84ee.firebaseapp.com",
      projectId: "subscriptions-f84ee",
      storageBucket: "subscriptions-f84ee.firebasestorage.app",
      messagingSenderId: "425125909485",
      appId: "1:425125909485:web:1dcdf4989d35e5e53c8de4",
      measurementId: "G-B6X1XTLM6Q"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // إدارة القائمة الجانبية
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    menuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
    });

    overlay.addEventListener('click', () => {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
    });

    // 🟦 مولّد للكود التلقائي
    function generateCode() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let code = '';
      for (let i = 0; i < 8; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    // 📌 تحميل الأكواد وتجميعها حسب الكورس
    async function loadGroupedCodes() {
      const container = document.getElementById("coursesContainer");
      container.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><h3>جاري تحميل الأكواد...</h3></div>';

      try {
        const snapshot = await getDocs(collection(db, "codes"));
        let courses = {};
        let totalCodes = 0;

        snapshot.forEach(doc => {
          const data = doc.data();
          const key = data.courseId || 'unknown';

          if (!courses[key]) {
            courses[key] = {
              title: data.courseTitle || 'كورس غير معروف',
              id: data.courseId || 'N/A',
              price: data.price || 'غير محدد',
              codes: []
            };
          }

          courses[key].codes.push({
            id: doc.id,
            code: data.code,
            isUsed: data.isUsed || false,
            createdAt: data.createdAt ? new Date(data.createdAt).toLocaleDateString('ar-EG') : 'غير محدد'
          });
          
          totalCodes++;
        });

        renderCourses(courses);
        updateStats(totalCodes, Object.keys(courses).length);
        
      } catch (error) {
        console.error("Error loading codes:", error);
        container.innerHTML = `
          <div class="loading" style="color: #dc3545;">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>حدث خطأ في تحميل الأكواد</h3>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    // 📌 تحديث الإحصائيات
    function updateStats(totalCodes, totalCourses) {
      document.getElementById('totalCodes').textContent = totalCodes;
      document.getElementById('codesCount').textContent = totalCodes;
    }

    // 📌 عرض الكورسات
    function renderCourses(courses) {
      const container = document.getElementById("coursesContainer");
      
      if (Object.keys(courses).length === 0) {
        container.innerHTML = `
          <div class="loading">
            <i class="fas fa-inbox"></i>
            <h3>لا توجد أكواد بعد</h3>
            <p>قم بإنشاء أول كود لتظهر هنا</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      
      Object.values(courses).forEach(course => {
        const courseBox = document.createElement("div");
        courseBox.className = "course-box";
        
        courseBox.innerHTML = `
          <div class="course-header">
            <h3>${course.title}</h3>
            <div class="course-id">كود الكورس: ${course.id}</div>
            <div style="font-size: 0.9rem; margin-top: 8px; opacity: 0.8;">
              <i class="fas fa-tag"></i> السعر: ${course.price} جنيه
              <span style="margin-right: 15px;">
                <i class="fas fa-hashtag"></i> عدد الأكواد: ${course.codes.length}
              </span>
            </div>
          </div>
          
          <div class="codes-container" id="codes-${course.id}">
            ${course.codes.map((item, index) => `
              <div class="code-item">
                <div class="code-header">
                  <div class="code-value">${item.code}</div>
                  <div class="status-badge ${item.isUsed ? 'status-used' : 'status-available'}">
                    ${item.isUsed ? 'مستخدم' : 'متاح'}
                  </div>
                </div>
                <div class="code-details">
                  <span><i class="far fa-calendar"></i> ${item.createdAt}</span>
                  <span><i class="fas fa-hashtag"></i> ${index + 1}</span>
                </div>
              </div>
            `).join('')}
          </div>
          
          <div class="course-footer">
            <button class="add-code-btn" onclick="addNewAutoCode('${course.id}', '${course.title.replace(/'/g, "\\'")}', '${course.price}')">
              <i class="fas fa-plus-circle"></i> إنشاء كود جديد تلقائيًا
            </button>
          </div>
        `;
        
        container.appendChild(courseBox);
      });
    }

    // 🟦 إنشاء كود جديد تلقائيًا
    async function addNewAutoCode(courseId, courseTitle, price) {
      const newCode = generateCode();
      
      try {
        await addDoc(collection(db, "codes"), {
          id: crypto.randomUUID(),
          code: newCode,
          courseId,
          courseTitle,
          price,
          isUsed: false,
          usedBy: null,
          usedAt: null,
          createdAt: new Date().toISOString()
        });

        // عرض رسالة نجاح
        showToast(`✅ تم إنشاء كود جديد: ${newCode}`, 'success');
        
        // إعادة تحميل البيانات
        setTimeout(() => {
          loadGroupedCodes();
        }, 1500);
        
      } catch (error) {
        showToast(`❌ حدث خطأ في إنشاء الكود: ${error.message}`, 'error');
      }
    }

    // 🔄 تحديث البيانات
    window.refreshData = function() {
      showToast('🔄 جاري تحديث البيانات...', 'info');
      loadGroupedCodes();
    };

    // 💬 رسائل التوست
    function showToast(message, type = 'info') {
      // إنشاء عنصر التوست إذا لم يكن موجودًا
      let toast = document.getElementById('customToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'customToast';
        toast.style.cssText = `
          position: fixed;
          top: 20px;
          left: 50%;
          transform: translateX(-50%) translateY(-100px);
          background: white;
          color: var(--dark);
          padding: 15px 25px;
          border-radius: 12px;
          box-shadow: 0 5px 20px rgba(0,0,0,0.2);
          z-index: 10000;
          font-weight: 600;
          display: flex;
          align-items: center;
          gap: 12px;
          transition: transform 0.5s ease;
          border-right: 4px solid ${type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : '#007bff'};
        `;
        document.body.appendChild(toast);
      }
      
      // تعيين الرسالة واللون
      const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : '🔄';
      toast.innerHTML = `${icon} ${message}`;
      toast.style.borderRightColor = type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : '#007bff';
      
      // إظهار التوست
      setTimeout(() => {
        toast.style.transform = 'translateX(-50%) translateY(0)';
      }, 10);
      
      // إخفاء التوست بعد 3 ثواني
      setTimeout(() => {
        toast.style.transform = 'translateX(-50%) translateY(-100px)';
      }, 3000);
    }

    // تحميل البيانات عند فتح الصفحة
    document.addEventListener('DOMContentLoaded', loadGroupedCodes);

    // تعيين الدوال للنافذة العامة
    window.addNewAutoCode = addNewAutoCode;
  </script>
 
</body>
</html>
